<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Talaan</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0A1A5C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Talaan">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Design: soft light surfaces, one indigo accent, Manrope type, a floating tab bar with a raised center Scan button, and a big round Scan button in the middle of the home screen. */
:root{
  color-scheme:light;
  --bg:#F2F4F9; --surface:#FFFFFF; --surface-2:#EDF0F7; --fg:#0F1729; --muted:#667089; --line:#E3E7F0;
  --accent:#3355FF; --accent-fg:#FFFFFF; --accent-soft:#E6EBFF;
  --ok:#0B7F51; --ok-bg:#DDF5EA; --late:#9A5700; --late-bg:#FFEFCF; --exc:#3A57A5; --exc-bg:#E3EAFB; --bad:#C02B2B; --bad-bg:#FDE4E4;
  --shade:rgba(10,16,34,.45);
  --sh1:0 1px 2px rgba(16,24,48,.05),0 6px 18px rgba(16,24,48,.05);
  --sh-nav:0 12px 32px rgba(16,24,48,.16),0 2px 6px rgba(16,24,48,.06);
  --sh-fab:0 10px 24px rgba(51,85,255,.40);
  --sh-btn:0 18px 40px rgba(51,85,255,.30);
  --av-bg-s:80%; --av-bg-l:91%; --av-fg-s:55%; --av-fg-l:34%;
  --display:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A0F1E; --surface:#131A2E; --surface-2:#1B2440; --fg:#EAEFFC; --muted:#8F9BBB; --line:#222C48;
    --accent:#8AA0FF; --accent-fg:#0A0F1E; --accent-soft:#1E2850;
    --ok:#4FD69C; --ok-bg:#0F3123; --late:#F5B85C; --late-bg:#3A2A10; --exc:#9DB6F2; --exc-bg:#1A2848; --bad:#FF8C8C; --bad-bg:#3C1B1F;
    --shade:rgba(0,0,0,.6);
    --sh1:0 1px 0 rgba(255,255,255,.03) inset;
    --sh-nav:0 12px 32px rgba(0,0,0,.45);
    --sh-fab:0 10px 24px rgba(138,160,255,.28);
    --sh-btn:0 18px 40px rgba(138,160,255,.20);
    --av-bg-s:35%; --av-bg-l:22%; --av-fg-s:80%; --av-fg-l:80%;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A0F1E; --surface:#131A2E; --surface-2:#1B2440; --fg:#EAEFFC; --muted:#8F9BBB; --line:#222C48;
  --accent:#8AA0FF; --accent-fg:#0A0F1E; --accent-soft:#1E2850;
  --ok:#4FD69C; --ok-bg:#0F3123; --late:#F5B85C; --late-bg:#3A2A10; --exc:#9DB6F2; --exc-bg:#1A2848; --bad:#FF8C8C; --bad-bg:#3C1B1F;
  --shade:rgba(0,0,0,.6);
  --sh1:0 1px 0 rgba(255,255,255,.03) inset;
  --sh-nav:0 12px 32px rgba(0,0,0,.45);
  --sh-fab:0 10px 24px rgba(138,160,255,.28);
  --sh-btn:0 18px 40px rgba(138,160,255,.20);
  --av-bg-s:35%; --av-bg-l:22%; --av-fg-s:80%; --av-fg-l:80%;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;font-weight:500;letter-spacing:-.005em;-webkit-text-size-adjust:100%;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
[hidden]{display:none!important}
img{max-width:100%}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p,ul,ol{margin:0}
ul{padding:0;list-style:none}
.in{width:100%;max-width:560px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.hint{color:var(--muted);font-size:13px;line-height:1.4}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);background:color-mix(in srgb,var(--bg) 85%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.top .in{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand svg{flex:none;border-radius:11px}
.brand-t{min-width:0}
.brand-name{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.03em;line-height:1.1}
.brand-sub{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw}
.chip{display:inline-flex;align-items:center;gap:8px;max-width:54%;min-height:38px;padding:7px 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface);box-shadow:var(--sh1);font-size:13px;font-weight:700}
.chip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px var(--ok-bg)}
.banner{padding-bottom:10px}
.banner p{background:var(--late-bg);color:var(--late);font-size:13px;font-weight:600;padding:10px 14px;border-radius:14px}

/* shell */
main.in{padding-top:6px;padding-bottom:132px;display:flex;flex-direction:column;gap:16px}
.title{font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:-.035em;line-height:1.1}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;pointer-events:none;padding:0 max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.tabs-in{pointer-events:auto;width:100%;max-width:520px;margin-inline:auto;display:grid;grid-template-columns:1fr 1fr 92px 1fr 1fr;grid-template-rows:60px;align-items:stretch;height:66px;padding:0 6px 6px;background:var(--surface);background:color-mix(in srgb,var(--surface) 90%,transparent);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:30px;box-shadow:var(--sh-nav)}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:100%;border:0;background:none;color:var(--muted);font-size:11px;font-weight:700;border-radius:16px}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent)}
.tab[aria-current="page"]::before{content:"";position:absolute;top:-1px;width:18px;height:3px;border-radius:3px;background:var(--accent)}
.tab-scan{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;height:100%;border:0;background:none;padding:0 0 3px;color:var(--accent);font-size:11px;font-weight:800}
.tab-scan>*{flex:none}
.tab-scan{overflow:visible}
.fab{display:grid;place-items:center;width:64px;height:64px;border-radius:50%;background:var(--accent);color:var(--accent-fg);border:4px solid var(--bg);box-shadow:var(--sh-fab);transition:transform .15s}
.fab svg{width:28px;height:28px;stroke-width:2.2}
.tab-scan:active .fab{transform:scale(.93)}
.tab-scan[aria-current="page"] .fab{box-shadow:0 0 0 5px var(--accent-soft),var(--sh-fab)}

/* cards and type */
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--sh1)}
.card-flat{padding-block:8px}
.h2{font-family:var(--display);font-weight:800;font-size:21px;letter-spacing:-.025em;line-height:1.15;text-wrap:balance}
.h3{font-family:var(--display);font-weight:800;font-size:17px;letter-spacing:-.02em;line-height:1.2;text-wrap:balance}
.eyebrow{font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.head-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:10px 18px;border-radius:14px;border:0;background:var(--surface-2);font-weight:700;font-size:14.5px;text-align:center;transition:transform .12s}
.btn:active{transform:scale(.98)}
.btn.sm{min-height:38px;padding:7px 14px;font-size:13.5px;border-radius:12px}
.btn.pri{background:var(--accent);color:var(--accent-fg);box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 28%,transparent)}
.btn.bad{background:var(--bad-bg);color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;align-items:center;border-radius:999px;padding:4px 11px;font-size:12px;font-weight:800;white-space:nowrap}
.p-present{background:var(--ok-bg);color:var(--ok)}
.p-late{background:var(--late-bg);color:var(--late)}
.p-excused{background:var(--exc-bg);color:var(--exc)}
.p-absent{background:var(--surface-2);color:var(--muted)}
.p-noqr{background:var(--late-bg);color:var(--late)}
label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
input[type=text],input[type=password],input[type=date],input[type=time],input[type=number],textarea{width:100%;min-height:48px;padding:11px 14px;font-size:16px;font-weight:600;background:var(--surface-2);border:1.5px solid transparent;border-radius:14px}
input::placeholder,textarea::placeholder{color:var(--muted);font-weight:500}
input:focus,textarea:focus{outline:0;border-color:var(--accent);background:var(--surface)}
textarea{min-height:120px;resize:vertical;font-family:var(--mono);font-size:14px;font-weight:500}
.fields{display:flex;flex-direction:column;gap:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.inline{display:flex;gap:8px;align-items:flex-end}
.inline>div{flex:1;min-width:0}
.err{color:var(--bad);font-size:13px;font-weight:700}
.link{background:none;border:0;color:var(--accent);font-weight:700;font-size:14px;padding:6px;min-height:36px}
.field-ic{position:relative}
.field-ic>svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--muted);pointer-events:none}
.field-ic input{padding-left:44px}

/* avatars */
.av{flex:none;display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;font-size:13.5px;font-weight:800;letter-spacing:.02em;background:hsl(var(--h) var(--av-bg-s) var(--av-bg-l));color:hsl(var(--h) var(--av-fg-s) var(--av-fg-l))}

/* home: class summary */
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:14px}
.hero-top>div:first-child{min-width:0}
.ring{flex:none}
.ring-t{font-family:var(--display);font-weight:800;font-size:14px;fill:var(--fg)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip-stat{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;background:var(--surface-2);font-size:12.5px;font-weight:700}
.chip-stat::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.chip-stat.s-p::before{background:var(--ok)}
.chip-stat.s-l::before{background:var(--late)}
.chip-stat.s-e::before{background:var(--exc)}
.chip-stat b{font-variant-numeric:tabular-nums}
.sess-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.meta{font-size:13px;color:var(--muted);font-weight:600}

/* home: scan button */
.scan-zone{display:flex;flex-direction:column;align-items:center;gap:16px;padding:22px 0 8px;text-align:center}
.scan-btn{position:relative;display:grid;place-items:center;width:168px;height:168px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-fg);box-shadow:var(--sh-btn),inset 0 2px 0 rgba(255,255,255,.28);transition:transform .15s}
.scan-btn:active{transform:scale(.97)}
.scan-btn svg{width:64px;height:64px}
.scan-btn::before,.scan-btn::after{content:"";position:absolute;border-radius:50%;border:2px solid var(--accent);pointer-events:none}
.scan-btn::before{inset:-14px;opacity:.3}
.scan-btn::after{inset:-30px;opacity:.14}
.scan-btn:disabled{background:var(--surface-2);color:var(--muted);box-shadow:none;cursor:not-allowed}
.scan-btn:disabled::before,.scan-btn:disabled::after{opacity:0}
@media (prefers-reduced-motion:no-preference){
  .scan-btn.busy::before{animation:pulse 1.2s ease-out infinite}
  .scan-btn.busy::after{animation:pulse 1.2s .3s ease-out infinite}
}
@keyframes pulse{from{transform:scale(.94);opacity:.5}to{transform:scale(1.08);opacity:0}}
.scan-cap{display:flex;flex-direction:column;gap:2px;max-width:300px}
.scan-cap strong{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.025em}
.pair .btn,main>.acts .btn{background:var(--surface);box-shadow:var(--sh1),inset 0 0 0 1px var(--line)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:360px}

/* results and manual entry */
.res{border-width:1.5px}
.res-ok{border-color:var(--ok);background:var(--ok-bg)}
.res-late{border-color:var(--late);background:var(--late-bg)}
.res-dup{border-color:var(--exc);background:var(--exc-bg)}
.res-fail{border-color:var(--bad);background:var(--bad-bg)}
.res .name{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.025em;line-height:1.15;text-wrap:balance}
.res-main{display:flex;align-items:center;gap:12px}
.res-main .av{width:48px;height:48px;font-size:16px}
.res-top{display:flex;justify-content:space-between;gap:10px;align-items:center}
.raw{font-size:13px;word-break:break-all;background:var(--surface);border-radius:12px;padding:10px 12px}
.nomatch{display:flex;flex-direction:column;align-items:flex-start;gap:8px}

/* setup steps */
.steps{display:flex;flex-direction:column;gap:14px}
.step{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:start}
.step .n{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:800;font-size:13px}
.step.done .n{background:var(--ok-bg);color:var(--ok)}
.step p{font-size:13.5px;color:var(--muted)}
.step strong{display:block;font-size:14.5px}

/* stats and lists */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{border-radius:18px;padding:12px 6px;text-align:center;background:var(--surface-2)}
.stat b{display:block;font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:-.03em;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase}
.stat.s-p{background:var(--ok-bg)}.stat.s-p b,.stat.s-p span{color:var(--ok)}
.stat.s-l{background:var(--late-bg)}.stat.s-l b,.stat.s-l span{color:var(--late)}
.stat.s-e{background:var(--exc-bg)}.stat.s-e b,.stat.s-e span{color:var(--exc)}
.stat.s-a b,.stat.s-a span{color:var(--muted)}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.f{flex:none;border:0;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);border-radius:999px;padding:8px 15px;font-size:13px;font-weight:700;min-height:38px}
.f[aria-pressed="true"]{background:var(--fg);color:var(--bg);box-shadow:none}
.rows>li{border-bottom:1px solid var(--line)}
.rows>li:last-child{border-bottom:0}
.row-btn{width:100%;display:flex;align-items:center;gap:12px;background:none;border:0;padding:11px 0;text-align:left;min-height:60px}
.row-btn .nm,.row .nm{flex:1;font-weight:700;min-width:0;overflow-wrap:anywhere}
.rt{display:flex;align-items:center;gap:8px;flex:none}
.tm{font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--muted)}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;min-height:60px}
.row>div:not(.acts){flex:1;min-width:0}
.code{font-family:var(--mono);font-size:12.5px;color:var(--muted);overflow-wrap:anywhere;font-weight:500}
.sub{display:block;font-weight:500}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:9px 6px;text-align:right;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal;min-width:130px;font-weight:700}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.empty{align-items:flex-start}
.mrow{display:flex;flex-direction:column;gap:10px;padding:14px 0}
.gsteps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:14px}

/* schedule form */
.days{display:flex;flex-wrap:wrap;gap:8px}
.daybox{display:inline-flex;align-items:center;gap:8px;margin:0;font-size:14px;font-weight:700;min-height:44px;padding:6px 14px;border-radius:999px;background:var(--surface-2);cursor:pointer}
.daybox input{width:18px;height:18px;margin:0;accent-color:var(--accent)}
.sdays{display:flex;flex-direction:column;gap:8px}
.sday{display:grid;grid-template-columns:92px minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:center}
.sday .daybox{width:100%;padding-inline:12px}
.sday.hdr{padding-top:0}
.sday input[type=time]{padding:8px 6px;min-height:44px}
.sday:has(input[type=checkbox]:not(:checked)) input[type=time]{opacity:.45}
.fmts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fmt{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:14px;min-height:84px;border:0;border-radius:18px;background:var(--surface-2)}
.fmt strong{font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:-.02em}
@media (max-width:340px){.fmts{grid-template-columns:1fr}}

/* camera */
#cam{position:fixed;inset:0;z-index:80;background:#000;display:flex;flex-direction:column}
#cam-v{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cam-frame{position:absolute;left:50%;top:36%;width:min(68vw,300px);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:28px;box-shadow:0 0 0 100vmax rgba(5,10,25,.55)}
.cam-frame i{position:absolute;width:40px;height:40px;border:5px solid #fff}
.cam-frame i:nth-child(1){top:0;left:0;border-right:0;border-bottom:0;border-top-left-radius:28px}
.cam-frame i:nth-child(2){top:0;right:0;border-left:0;border-bottom:0;border-top-right-radius:28px}
.cam-frame i:nth-child(3){bottom:0;left:0;border-right:0;border-top:0;border-bottom-left-radius:28px}
.cam-frame i:nth-child(4){bottom:0;right:0;border-left:0;border-top:0;border-bottom-right-radius:28px}
.cam-frame::after{content:"";position:absolute;left:14px;right:14px;top:14px;height:3px;border-radius:3px;background:#fff;opacity:.85;box-shadow:0 0 12px rgba(255,255,255,.7)}
@media (prefers-reduced-motion:no-preference){.cam-frame::after{animation:sweep2 1.6s ease-in-out infinite alternate}}
@keyframes sweep2{from{top:14px}to{top:calc(100% - 17px)}}
.cam-panel{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:28px 28px 0 0;display:flex;flex-direction:column;gap:12px;padding-top:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.cam-msg{border-radius:18px;padding:14px 16px;background:var(--surface-2);min-height:76px}
.cam-msg.ok{background:var(--ok-bg);color:var(--ok)}
.cam-msg.late{background:var(--late-bg);color:var(--late)}
.cam-msg.dup{background:var(--exc-bg);color:var(--exc)}
.cam-t{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.025em;line-height:1.15;overflow-wrap:anywhere}
.cam-s{font-size:14px;margin-top:2px;font-weight:600;font-variant-numeric:tabular-nums}
.cam-acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* sheet and toast */
body.sec [data-act="newsched"],body.sec [data-act="newclass"],body.sec [data-act="delsched"],body.sec [data-act="delsession"],body.sec [data-act="regmanual"]{display:none!important}

<script>
(function(){

function parseDate(s){var p=String(s||'').split('-').map(Number);return new Date(p[0],(p[1]||1)-1,p[2]||1)}
function fmtDate(s){try{return parseDate(s).toLocaleDateString('en-PH',{weekday:'short',month:'short',day:'numeric',year:'numeric'})}catch(e){return s}}

var MARK='<svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 512 512"><defs><linearGradient id="mbgA" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A1A5C"/><stop offset="1" stop-color="#050A26"/></linearGradient><linearGradient id="mglowTL" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#31B6FF"/><stop offset=".55" stop-color="#1C6BFF"/><stop offset="1" stop-color="#0A2DB8"/></linearGradient><linearGradient id="mglowBR" x1="1" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#1D55FF"/><stop offset="1" stop-color="#0A2DB8" stop-opacity="0"/></linearGradient><linearGradient id="mcal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#63BBFF"/><stop offset="1" stop-color="#2060F2"/></linearGradient><linearGradient id="mswoosh" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#2A8DFF"/><stop offset="1" stop-color="#6FD0FF"/></linearGradient><linearGradient id="mchk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2B6BFF"/><stop offset="1" stop-color="#1239C9"/></linearGradient><clipPath id="mclip"><rect width="512" height="512" rx="112"/></clipPath></defs><g clip-path="url(#mclip)">  <rect width="512" height="512" fill="url(#mbgA)"/>  <path d="M0 0H300C210 40 120 120 70 230C40 296 20 380 0 430Z" fill="url(#mglowTL)" opacity=".95"/>  <path d="M512 512H200C300 470 420 430 512 300Z" fill="url(#mglowBR)"/>  <g transform="translate(0 0) scale(1)"><!-- swoosh behind calendar (bottom-left) --><path d="M64 352C78 430 222 476 392 392C290 434 156 428 64 352Z" fill="url(#mswoosh)"/><path d="M64 352C58 318 82 292 112 274C96 296 92 322 106 346Z" fill="url(#mswoosh)" opacity=".9"/><!-- calendar --><g transform="rotate(-5 228 262)">  <rect x="98" y="120" width="262" height="262" rx="40" fill="url(#mcal)"/>  <rect x="124" y="172" width="210" height="190" rx="20" fill="#EEF2FF"/>  <g fill="#4A5EA6">    <rect x="144" y="194" width="52" height="44" rx="9"/><rect x="208" y="194" width="52" height="44" rx="9"/><rect x="272" y="194" width="44" height="44" rx="9"/>    <rect x="144" y="252" width="52" height="44" rx="9"/><rect x="272" y="252" width="44" height="44" rx="9"/>    <rect x="144" y="310" width="52" height="44" rx="9"/><rect x="208" y="310" width="52" height="44" rx="9"/>  </g>  <rect x="206" y="250" width="56" height="48" rx="11" fill="url(#mchk)"/>  <path d="M220 275l11 11 20-22" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>  <g fill="#F4F7FF" stroke="#071040" stroke-width="7"><rect x="156" y="86" width="30" height="72" rx="15"/><rect x="274" y="86" width="30" height="72" rx="15"/></g></g><!-- swoosh arc right --><path d="M404 214C452 214 470 258 440 304C426 326 404 342 380 352C422 322 436 282 420 252C412 236 404 226 404 214Z" fill="url(#mswoosh)" opacity=".95"/><!-- sparkle --><g stroke="#38B6FF" stroke-width="11" stroke-linecap="round"><path d="M398 84l-14 38"/><path d="M452 112l-34 20"/></g><!-- QR badge --><g transform="translate(316 300)">  <rect x="0" y="0" width="124" height="124" rx="22" fill="#071040" stroke="#071040" stroke-width="10"/>  <g fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">    <path d="M8 36V20a12 12 0 0 1 12-12h16"/><path d="M88 8h16a12 12 0 0 1 12 12v16"/><path d="M116 88v16a12 12 0 0 1-12 12H88"/><path d="M36 116H20a12 12 0 0 1-12-12V88"/>  </g>  <g fill="#fff">    <path fill-rule="evenodd" d="M30 30h26v26H30zM38 38v10h10V38z"/><path fill-rule="evenodd" d="M68 30h26v26H68zM76 38v10h10V38z"/><path fill-rule="evenodd" d="M30 68h26v26H30zM38 76v10h10V76z"/>    <rect x="68" y="68" width="12" height="12"/><rect x="84" y="84" width="10" height="10"/><rect x="68" y="84" width="10" height="10"/>  </g>  <g fill="#3AA6FF"><rect x="41" y="41" width="4" height="4"/><rect x="79" y="41" width="4" height="4"/><rect x="41" y="79" width="4" height="4"/></g></g></g></g></svg>';

/* ---------- state ---------- */
var S={
  tab:'scan',loading:true,mode:'loading',banner:'',
  students:[],section:'',schedules:[],gs:null,gsBusy:false,gsOpen:false,sessions:{},activeId:ls.get('talaan-active'),
  f:{},filter:'all',expanded:null,confirm:null,ct:null,
  sheet:null,err:'',last:null,busy:false,importOpen:false,
  db:null,dl:null
};

/* ---------- storage ---------- */
function sortStudents(){S.students.sort(function(a,b){return a.n.localeCompare(b.n,'en',{sensitivity:'base'})})}
function cmpSess(a,b){return a.date<b.date?-1:a.date>b.date?1:(a.created||0)-(b.created||0)}
function sortedSessions(dir){var a=Object.keys(S.sessions).map(function(k){return S.sessions[k]}).sort(cmpSess);return dir==='asc'?a:a.reverse()}
function pickActive(){
  if(S.activeId&&S.sessions[S.activeId])return;
  var a=sortedSessions('desc');S.activeId=a.length?a[0].id:null;
}
function setActive(id){S.activeId=id;ls.set('talaan-active',id||'')}
function sessionDoc(s){return {date:s.date,subject:s.subject,start:s.start,grace:s.grace,created:s.created||0,records:s.records,end:s.end||'',sch:s.sch||''}}
function saveLocal(){ls.set('talaan-data',JSON.stringify({students:S.students,section:S.section,schedules:S.schedules,sessions:S.sessions}))}
function loadLocal(){
  try{
    var d=JSON.parse(ls.get('talaan-data')||'null');
    if(d){S.students=d.students||[];S.section=d.section||'';S.sessions=d.sessions||{};S.schedules=normSched(d.schedules||[]);}
  }catch(e){}
  sortStudents();
}
var queues={};
function enqueue(key,fn){queues[key]=(queues[key]||Promise.resolve()).then(fn).catch(writeFail)}
function writeFail(e){
  console.warn(e);
  var c=e&&e.code;
  toast(c==='invalid_argument'?'Could not save. You only have view access to this page.':c==='quota_exceeded'?'The page storage is full.':'Could not save. Please try again.');
}
function persistRoster(){
  if(S.mode==='cloud')enqueue('roster',function(){return S.db.doc('cfg/roster').set({students:S.students,section:S.section,schedules:S.schedules})});
  else{saveLocal();cfgPushSoon()}
}
function persistSession(id){
  if(S.mode==='cloud')enqueue('s'+id,function(){var s=S.sessions[id];return s?S.db.doc('sessions/'+id).set(sessionDoc(s)):Promise.resolve()});
  else{saveLocal();var s0=S.sessions[id];if(s0&&S.gs&&S.gs.url&&S.gs.auto)gsSync(s0,false,false)}
}
function removeSessionStore(id){
  if(S.mode==='cloud')enqueue('s'+id,function(){return S.db.doc('sessions/'+id).delete()});
  else saveLocal();
}
function useCap(n){
  try{if(window.claude&&window.claude.use)return window.claude.use(n).catch(function(){return null})}catch(e){}
  return Promise.resolve(null);
}
async function init(){
  S.mode='local';S.gs=loadGs();loadLocal();pickActive();S.loading=false;joinFromHash();render();gsFlush().then(function(){cfgPush(false);gsPull(true)});
}

/* ---------- domain ---------- */
function active(){return S.activeId?S.sessions[S.activeId]:null}
function stuBy(i){return S.students.find(function(s){return s.i===i})}
function recOf(ses,i){return ses.records.find(function(r){return r.i===i})}
function lateAt(ses){var d=parseDate(ses.date),t=String(ses.start||'00:00').split(':').map(Number);return new Date(d.getFullYear(),d.getMonth(),d.getDate(),t[0]||0,(t[1]||0)+Number(ses.grace||0))}
function endAt(ses){if(!ses.end)return null;var d=parseDate(ses.date),t=String(ses.end).split(':').map(Number);return new Date(d.getFullYear(),d.getMonth(),d.getDate(),t[0]||0,t[1]||0)}
function statusNow(ses){return new Date()>lateAt(ses)?'late':'present'}
function findStudent(raw){
  var n=norm(raw);if(!n)return null;
  var withCode=S.students.filter(function(s){return s.c});
  var hit=withCode.find(function(s){return norm(s.c)===n});
  if(hit)return hit;
  return withCode.find(function(s){var c=norm(s.c);return c.length>=4&&n.indexOf(c)!==-1})||null;
}
function markIn(i,method){
  var ses=active();
  if(!ses){toast('Add a class first.');return null}
  var ex=recOf(ses,i);if(ex)return {dup:true,rec:ex};
  var en=endAt(ses);if(en&&new Date()>en)toast('Note: this class has already ended.');
  var rec={i:i,t:new Date().toISOString(),m:method,s:statusNow(ses)};
  ses.records=ses.records.concat([rec]);persistSession(ses.id);
  return {rec:rec};
}
function setStatus(i,s){
  var ses=active();if(!ses)return;
  var ex=recOf(ses,i);
  if(ex){
    ses.records=ses.records.map(function(r){if(r.i!==i)return r;var t=r.t;if(!t&&s!=='excused')t=new Date().toISOString();return {i:r.i,t:t,m:r.m,s:s}});
  }else{
    ses.records=ses.records.concat([{i:i,t:s==='excused'?null:new Date().toISOString(),m:'manual',s:s}]);
  }
  persistSession(ses.id);
}
function removeRec(i){
  var ses=active();if(!ses)return;
  ses.records=ses.records.filter(function(r){return r.i!==i});persistSession(ses.id);
}
function classify(ses){
  var by=new Map(ses.records.map(function(r){return [r.i,r]}));
  var o={p:[],l:[],e:[],a:[]};
  S.students.forEach(function(st){
    var r=by.get(st.i),x={st:st,rec:r||null};
    if(!r)o.a.push(x);else if(r.s==='late')o.l.push(x);else if(r.s==='excused')o.e.push(x);else o.p.push(x);
  });
  return o;
}
function byTimeDesc(a,b){return String(b.rec.t||'').localeCompare(String(a.rec.t||''))}
function addStudent(n,c){
  n=String(n).trim().replace(/\s+/g,' ');c=String(c).trim();
  if(!n)return 'Enter the student name.';
  if(c&&S.students.some(function(s){return norm(s.c)===norm(c)}))return 'A student with this QR code already exists.';
  var st={i:uid('u'),n:n,c:c};S.students.push(st);sortStudents();persistRoster();return st;
}
function doImport(text){
  var lines=String(text).split(/\r?\n/).map(function(l){return l.trim()}).filter(Boolean);
  var added=0,skipped=0;
  var codes=new Set(S.students.map(function(s){return norm(s.c)}).filter(Boolean));
  var names=new Set(S.students.map(function(s){return s.n.toLowerCase()}));
  lines.forEach(function(l){
    l=l.replace(/^\d{1,3}[.)]\s+/,'');
    var c='',n=l,m=l.match(/^([^\s,;|\t]*\d[^\s,;|\t]*)\s*[,;|\t]?\s*(.*)$/);
    if(m&&m[1].length>=4){c=m[1];n=m[2]}
    n=n.replace(/\s+/g,' ').trim();
    if(!n||(c&&codes.has(norm(c)))||names.has(n.toLowerCase())){skipped++;return}
    S.students.push({i:uid('u'),n:n,c:c});names.add(n.toLowerCase());if(c)codes.add(norm(c));added++;
  });
  if(added){sortStudents();persistRoster()}
  return {added:added,skipped:skipped};
}

/* ---------- QR decoding ---------- */
async function loadBitmap(file){
  try{if(window.createImageBitmap)return await createImageBitmap(file,{imageOrientation:'from-image'})}catch(e){}
  var url=URL.createObjectURL(file);
  var img=new Image();img.src=url;
  try{await img.decode()}finally{setTimeout(function(){URL.revokeObjectURL(url)},5000)}
  return img;
}
async function decodeQR(file){
  var src=await loadBitmap(file);
  var w0=src.width||src.naturalWidth,h0=src.height||src.naturalHeight;
  if('BarcodeDetector' in window){
    try{var det=new window.BarcodeDetector({formats:['qr_code']});var r=await det.detect(src);if(r&&r[0]&&r[0].rawValue)return r[0].rawValue}catch(e){}
  }
  if(typeof window.jsQR!=='function')throw new Error('jsQR not loaded');
  var cv=document.createElement('canvas'),ctx=cv.getContext('2d',{willReadFrequently:true});
  var seen={};
  var sizes=[1100,700,1600,450];
  for(var k=0;k<sizes.length;k++){
    var sc=Math.min(1,sizes[k]/Math.max(w0,h0));
    var w=Math.max(1,Math.round(w0*sc)),h=Math.max(1,Math.round(h0*sc));
    if(seen[w+'x'+h])continue;seen[w+'x'+h]=1;
    cv.width=w;cv.height=h;ctx.drawImage(src,0,0,w,h);
    var d=ctx.getImageData(0,0,w,h);
    var code=window.jsQR(d.data,w,h,{inversionAttempts:'attemptBoth'});
    if(code&&code.data)return code.data;
    await new Promise(function(res){setTimeout(res,0)});
  }
  return null;
}
async function scanFile(file,mode){
  if(!file)return;
  if(mode==='scan'&&!active()){toast('Add a class first.');return}
  S.busy=true;S.last=null;render();
  var raw=null;
  try{raw=await decodeQR(file)}catch(e){console.warn(e)}
  S.busy=false;
  if(mode==='reg'){
    if(raw){S.f['f-code']=raw;toast('QR read.')}else toast('Could not read the QR. Try again.');
    render();return;
  }
  if(!raw){S.last={kind:'fail'};render();return}
  var st=findStudent(raw);
  if(!st){S.last={kind:'new',raw:raw};S.f['f-newname']='';render();return}
  var r=markIn(st.i,'qr');
  S.last=r&&r.dup?{kind:'dup',i:st.i}:{kind:'ok',i:st.i};
  render();
}

/* ---------- live camera scanner ---------- */
var CAM={on:false,stream:null,raf:0,last:0,busy:false,det:null,cv:null,ctx:null,lastRaw:'',lastAt:0,ac:null};
function beep(){
  try{CAM.ac=CAM.ac||new (window.AudioContext||window.webkitAudioContext)();if(CAM.ac.state==='suspended')CAM.ac.resume();var o=CAM.ac.createOscillator(),g=CAM.ac.createGain();o.frequency.value=880;g.gain.value=.15;o.connect(g);g.connect(CAM.ac.destination);o.start();o.stop(CAM.ac.currentTime+.12)}catch(e){}
  try{if(navigator.vibrate)navigator.vibrate(60)}catch(e){}
}
function camSay(kind,title,sub){var m=$('#cam-msg');m.className='cam-msg '+kind;m.innerHTML='<div class="cam-t">'+esc(title)+'</div><div class="cam-s">'+esc(sub||'')+'</div>'}
function camCount(){var ses=active();if(!ses)return '';var st=statsOf(ses);return (st.p+st.l+st.e)+' of '+st.total+' checked in'}
async function camStart(){
  if(!active()){toast('Add a class first.');return}
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){toast('Live camera is not available here. Use photo scan instead.');return}
  try{CAM.ac=CAM.ac||new (window.AudioContext||window.webkitAudioContext)()}catch(e){}
  var stream;
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false})}
  catch(e){toast(e&&e.name==='NotAllowedError'?'Camera access was blocked. Allow it in your browser settings, then try again.':'Could not open the camera. Use photo scan instead.');return}
  CAM.stream=stream;
  var v=$('#cam-v');v.srcObject=stream;try{await v.play()}catch(e){}
  CAM.on=true;$('#cam').hidden=false;document.body.style.overflow='hidden';
  CAM.det=null;
  if('BarcodeDetector' in window){try{CAM.det=new window.BarcodeDetector({formats:['qr_code']})}catch(e){}}
  CAM.cv=CAM.cv||document.createElement('canvas');CAM.ctx=CAM.cv.getContext('2d',{willReadFrequently:true});
  CAM.lastRaw='';CAM.lastAt=0;CAM.busy=false;
  camSay('idle','Point the camera at the QR on the ID',camCount());
  camLoop();
}
function camStop(){
  CAM.on=false;cancelAnimationFrame(CAM.raf);
  if(CAM.stream){CAM.stream.getTracks().forEach(function(t){t.stop()});CAM.stream=null}
  var v=$('#cam-v');if(v)v.srcObject=null;
  $('#cam').hidden=true;document.body.style.overflow='';
}
function camLoop(){
  if(!CAM.on)return;

var GS_SCRIPT="// Talaan v3: receives attendance from the Talaan app, keeps one tab per class, and signs people in.\n// Set two Script properties (Project Settings > Script properties): ADMIN_PASS and SECRETARY_PASS.\n// Whoever signs in with ADMIN_PASS is an admin. Whoever signs in with SECRETARY_PASS is a secretary. Any name works.\nvar SECRET = '__TOKEN__';\nvar TAB = 'Attendance';\nvar HEAD = ['Date', 'Subject', 'Section', 'Student', 'ID/QR', 'Status', 'Time in', 'Method', 'Start', 'End', 'Key'];\nvar P = PropertiesService.getScriptProperties();\n\nfunction doGet() {\n  return json_({ ok: true, app: 'Talaan', v: 3 });\n}\n\nfunction doPost(e) {\n  var lock = LockService.getScriptLock();\n  lock.waitLock(20000);\n  try {\n    var data = JSON.parse(e.postData.contents);\n    var role = roleOf_(data);\n    if (!role) return json_({ ok: false, error: 'auth' });\n    var admin = role === 'admin';\n    var user = admin ? null : { name: String(data.u || ''), classes: [] };\n    var act = data.action || 'ops';\n    var ss = SpreadsheetApp.getActiveSpreadsheet();\n\n    if (act === 'login') {\n      return json_({ ok: true, v: 3, role: role, name: String(data.u || '') || (admin ? 'Admin' : 'Secretary'), cfg: cfg_() });\n    }\n    if (act === 'pull') {\n      return json_({ ok: true, v: 3, rows: readRows_(ss, user), cfg: cfg_() });\n    }\n    if (act === 'ops') {\n      var sh = sheet_(ss);\n      var last = sh.getLastRow();\n      var keys = last > 1\n        ? sh.getRange(2, 11, last - 1, 1).getValues().map(function (r) { return String(r[0]); })\n        : [];\n      var ops = data.ops || [], n = 0, touched = {};\n      ops.forEach(function (op) {\n        if (!allowed_(user, op.row[1])) return;\n        var i = keys.indexOf(op.key);\n        if (i > -1) {\n          sh.getRange(i + 2, 1, 1, HEAD.length).setValues([op.row]);\n        } else {\n          sh.appendRow(op.row);\n          keys.push(op.key);\n        }\n        touched[norm_(op.row[1])] = true;\n        n++;\n      });\n      rebuild_(ss, Object.keys(touched));\n      return json_({ ok: true, v: 3, n: n });\n    }\n\n    if (!admin) return json_({ ok: false, error: 'forbidden' });\n\n    if (act === 'test') {\n      var t = ss.getSheetByName('Test') || ss.insertSheet('Test');\n      t.appendRow([new Date(), 'Talaan connection OK']);\n      return json_({ ok: true, v: 3 });\n    }\n    if (act === 'setConfig') {\n      setCfg_(JSON.stringify(data.cfg || {}));\n      rebuild_(ss, null);\n      return json_({ ok: true, v: 3 });\n    }\n    if (act === 'rebuild') {\n      rebuild_(ss, null);\n      return json_({ ok: true, v: 3 });\n    }\n    return json_({ ok: false, error: 'unknown action' });\n  } catch (err) {\n    return json_({ ok: false, error: String(err) });\n  } finally {\n    lock.releaseLock();\n  }\n}\n\nfunction norm_(s) { return String(s == null ? '' : s).trim().toLowerCase().replace(/\\s+/g, ''); }\n\nfunction roleOf_(data) {\n  if (SECRET && data.token === SECRET) return 'admin';\n  var pw = String(data.h == null ? '' : data.h);\n  if (!pw) return null;\n  var ap = P.getProperty('ADMIN_PASS'), sp = P.getProperty('SECRETARY_PASS');\n  if (ap && pw === String(ap).trim()) return 'admin';\n  if (sp && pw === String(sp).trim()) return 'secretary';\n  return null;\n}\nfunction allowed_(user, subject) {\n  if (!user) return true;\n  var c = user.classes || [];\n  if (!c.length) return true;\n  return c.some(function (x) { return norm_(x) === norm_(subject); });\n}\nfunction cfg_() {\n  var n = Number(P.getProperty('CFG_N') || 0), s = '';\n  for (var i = 0; i < n; i++) s += P.getProperty('CFG_' + i) || '';\n  try { return s ? JSON.parse(s) : null; } catch (e) { return null; }\n}\nfunction setCfg_(str) {\n  var old = Number(P.getProperty('CFG_N') || 0), n = Math.ceil(str.length / 8000), o = {}, i;\n  for (i = 0; i < n; i++) o['CFG_' + i] = str.substr(i * 8000, 8000);\n  o.CFG_N = String(n);\n  P.setProperties(o);\n  for (i = n; i < old; i++) P.deleteProperty('C s held', 'Students', 'Present', 'Late', 'Excused', 'Absent', 'Avg rate %']];\n  Object.keys(names).forEach(function (k) {\n    var t = buildClass_(names[k], by[k], cfg);\n    summary.push(t.sum);\n    if (!only || only.indexOf(k) > -1) {\n      var sh = writeTab_(ss, 'Class - ' + safeName_(names[k]), t.values, t.ncols);\n      sh.getRange(4, 1, 1, t.values[3].length).setFontWeight('bold');\n      sh.setFrozenRows(4);\n      sh.setFrozenColumns(1);\n    }\n  });\n  var sm = writeTab_(ss, 'Summary', summary, 1);\n  sm.getRange(1, 1, 1, 8).setFontWeight('bold');\n  sm.setFrozenRows(1);\n}\n\nfunction json_(o) {\n  return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON);\n}\n";

async function gsPull(silent){

    return;

}

function saveFile(filename,data){
  try{
    var mime=/\.csv$/.test(filename)?'text/csv;charset=utf-8':/\.txt$/.test(filename)?'text/plain;charset=utf-8':'';
    var b=data instanceof Blob?data:new Blob([data],{type:mime}),u=URL.createObjectURL(b),a=document.createElement('a');
    a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(u)},5000);toast('Saving '+filename);
  }catch(e){toast('Could not save the file.')}
}
function summaryText(ses){
  var c=classify(ses),total=S.students.length;
  var L=[];
  L.push('Attendance'+(S.section?' - '+S.section:''));
  L.push(ses.subject+' | '+fmtDate(ses.date));
  L.push('Present: '+c.p.length+' | Late: '+c.l.length+' | Excused: '+c.e.length+' | Absent: '+c.a.length+' | Total: '+total);
  if(c.l.length)L.push('','Late: '+c.l.map(function(x){return x.st.n+' ('+fmtTime(x.rec.t)+')'}).join('; '));
  if(c.e.length)L.push('','Excused: '+c.e.map(function(x){return x.st.n}).join('; '));
  if(c.a.length)L.push('','Absent: '+c.a.map(function(x){return x.st.n}).join('; '));
  return L.join('\n');
}
async function copyText(t){
  try{await navigator.clipboard.writeText(t);toast('Copied.')}
  catch(e){S.sheet={type:'text',title:'Copy the text',text:t};renderSheet()}
}
function report(){
  var sess=sortedSessions('asc');
  return S.students.map(function(st){
    var p=0,l=0,e=0,a=0;
    sess.forEach(function(ses){var r=recOf(ses,st.i);if(!r)a++;else if(r.s==='late')l++;else if(r.s==='excused')e++;else p++});
    var den=sess.length-e;
    return {st:st,p:p,l:l,e:e,a:a,rate:den>0?Math.round(100*(p+l)/den):null};
  }).sort(function(x,y){return y.a-x.a||x.st.n.localeCompare(y.st.n)});
}

/* ---------- weekly schedule ---------- */
var DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var DAY_ORDER=[1,2,3,4,5,6,0];
function wkDate(s){try{return parseDate(s).toLocaleDateString('en-PH',{weekday:'short',month:'short',day:'numeric'})}catch(e){return s}}
function normSched(arr){
  return (arr||[]).map(function(x){
    if(Array.isArray(x.slots))return x;
    var days=Array.isArray(x.days)?x.days:[];
    return {id:x.id,subject:x.subject,grace:x.grace,slots:days.map(function(k){return {d:k,start:x.start||'07:30',end:x.end||''}})};
  });
}
function slotOf(x,k){return x.slots.find(function(z){return z.d===k})}
function slotText(z){return DAYS[z.d]+' '+fmt12(z.start)+(z.end?' to '+fmt12(z.end):'')}
function nextDate(x){
  var d=new Date();
  for(var k=0;k<8;k++){
    var c=new Date(d.getFullYear(),d.getMonth(),d.getDate()+k);
    if(slotOf(x,c.getDay()))return c.getFullYear()+'-'+pad(c.getMonth()+1)+'-'+pad(c.getDate());
  }
  return todayStr();
}
function todayCard(){
  var t=todayStr(),dow=new Date().getDay(),ses=active();
  var list=S.schedules.filter(function(x){return slotOf(x,dow)});
  if(!list.length)return '';
  var all=sortedSessions('desc');
  var rows=list.map(function(x){
    var z=slotOf(x,dow);
    var ex=all.find(function(s){return s.sch===x.id&&s.date===t});
    if(ex&&ses&&ses.id===ex.id)return '';
    return '<li class="row"><div style="min-width:0"><span class="nm">'+esc(x.subject)+'</span><span class="sub hint">'+esc(fmt12(z.start))+(z.end?' to '+esc(fmt12(z.end)):'')+(ex?' &middot; already started':'')+'</span></div>'
      +(ex?'<button class="btn sm" data-act="switchsess" data-id="'+ex.id+'">Switch to it</button>':'<button class="btn sm pri" data-act="startsched" data-id="'+x.id+'">Start class</button>')+'</li>';
  }).filter(Boolean);
  if(!rows.length)return '';
  return '<section class="card"><div class="eyebrow">Scheduled today</div><ul class="rows">'+rows.join('')+'</ul></section>';
}

function schedForm(){
  var rows=DAY_ORDER.map(function(k){
    return '<div class="sday"><label class="daybox" for="f-day-'+k+'"><input type="checkbox" id="f-day-'+k+'"'+(fv('f-day-'+k,false)?' checked':'')+'>'+DAYS[k]+'</label>'
      +'<input type="time" id="f-ds-'+k+'" aria-label="'+DAYS[k]+' start time" value="'+esc(fv('f-ds-'+k,'07:30'))+'">'
      +'<input type="time" id="f-de-'+k+'" aria-label="'+DAYS[k]+' end time" value="'+esc(fv('f-de-'+k,'09:00'))+'"></div>';
  }).join('');
  return '<form class="fields" data-form="newsched"><h2 class="h2">Add class</h2>'
    +'<div><label for="f-ssubj">Subject</label><input type="text" id="f-ssubj" value="'+esc(fv('f-ssubj'))+'" placeholder="e.g. Math 101" autocomplete="off"></div>'
    +'<div><label>Days it meets, with start and end time</label><div class="sdays"><div class="sday hdr"><span></span><span class="hint">Start</span><span class="hint">End</span></div>'+rows+'</div></div>'
    +'<div><label for="f-sgrace">Grace period (minutes)</label><input type="number" id="f-sgrace" min="0" max="120" inputmode="numeric" value="'+esc(fv('f-sgrace',10))+'"></div>'
    +'<p class="hint">Tick one day if the class meets once a week, or two days for twice a week. Each ticked day has its own start and end time, so they can be different.</p>'
    +(S.err?'<p class="err">'+esc(S.err)+'</p>':'')
    +'<div class="acts"><button class="btn pri" type="submit">Save class</button><button class="btn" type="button" data-act="closesheet">Cancel</button></div></form>';
}

/* ---------- ui bits ---------- */
var tt;
function toast(m){var el=$('#toast');el.textContent=m;el.classList.add('show');clearTimeout(tt);tt=setTimeout(function(){el.classList.remove('show')},2800)}
function arm(key){
  if(S.confirm===key){S.confirm=null;clearTimeout(S.ct);return true}
  S.confirm=key;clearTimeout(S.ct);S.ct=setTimeout(function(){S.confirm=null;render()},3500);render();return false;
}
function pill(s){return '<span class="pill p-'+s+'">'+LBL[s]+'</span>'}
function fv(id,def){return S.f[id]!==undefined?S.f[id]:(def==null?'':def)}
function empty(title,text,label,act,extra){
  return '<section class="card empty"><h2 class="h2">'+esc(title)+'</h2><p class="muted">'+esc(text)+'</p><button class="btn pri" data-act="'+act+'" '+(extra||'')+'>'+esc(label)+'</button></section>';
}
function statsOf(ses){
  var c=classify(ses);return {p:c.p.length,l:c.l.length,e:c.e.length,a:c.a.length,total:S.students.length};
}

function initials(n){
  var s=String(n||'').trim();if(!s)return '?';
  var a,b;
  if(s.indexOf(',')>-1){var p=s.split(',');b=p[0].trim();a=p.slice(1).join(' ').trim()}
  else{var w=s.split(/\s+/);a=w[0];b=w.length>1?w[w.length-1]:''}
  return ((a||'').charAt(0)+(b||'').charAt(0)).toUpperCase()||'?';
}
function avatar(n){var k=0,s=String(n||'');for(var i=0;i<s.length;i++)k=(k*31+s.charCodeAt(i))%360;return '<span class="av" style="--h:'+k+'" aria-hidden="true">'+esc(initials(n))+'</span>'}
function ring(here,total){
  var pct=total?here/total:0,r=26,c=2*Math.PI*r;
  return '<svg class="ring" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="'+here+' of '+total+' checked in"><circle cx="32" cy="32" r="'+r+'" fill="none" stroke="var(--surface-2)" stroke-width="8"/><circle cx="32" cy="32" r="'+r+'" fill="none" stroke="var(--accent)" stroke-width="8" stroke-linecap="round" stroke-dasharray="'+(c*pct).toFixed(1)+' '+c.toFixed(1)+'" transform="rotate(-90 32 32)"/><text x="32" y="37" text-anchor="middle" class="ring-t">'+Math.round(pct*100)+'%</text></svg>';
}
function installCard(){
  return S.installEvt?'<section class="card"><div class="head-row"><div style="min-width:0"><h3 class="h3">Install Talaan</h3><p class="hint">Add it to your home screen so it opens like an app.</p></div><button class="btn pri" data-act="install">Install</button></div></section>':'';
}
function bannerHTML(t){return '<div class="banner"><div class="in"><p>'+t+'</p></div></div>'}

/* ---------- views ---------- */

  return '<header class="top"><div class="in"><div class="brand">'+MARK+'<div class="brand-t"><div class="brand-name">Talaan</div><div class="brand-sub">'+esc(S.section||'QR attendance')+'</div></div></div>'+chip+'</div>'+ban+'</header>';

function tabsHTML(){
  function t(k,l,ic){return '<button class="tab" data-act="tab" data-t="'+k+'"'+(S.tab===k?' aria-current="page"':'')+'>'+ic+'<span>'+l+'</span></button>'}

    +t('ppl','Students',IC.ppl)+t('set','Settings',IC.set)+'</div></nav>';

function sessionCard(ses){
  var st=statsOf(ses),here=st.p+st.l+st.e,lt=lateAt(ses);
  return '<section class="card"><div class="hero-top"><div><div class="eyebrow">Active class</div><h2 class="h2">'+esc(ses.subject)+'</h2><p class="meta">'+esc(fmtDate(ses.date))+'</p><p class="meta">'+esc(fmt12(ses.start))+(ses.end?' to '+esc(fmt12(ses.end)):'')+' &middot; Late after '+esc(fmt12(lt.getHours()+':'+pad(lt.getMinutes())))+'</p></div>'+ring(here,st.total)+'</div>'
    +'<div class="chips"><span class="chip-stat s-p"><b>'+st.p+'</b> Present</span><span class="chip-stat s-l"><b>'+st.l+'</b> Late</span><span class="chip-stat s-e"><b>'+st.e+'</b> Excused</span><span class="chip-stat"><b>'+st.a+'</b> Not yet</span></div></section>';
}
function setupCard(ses){
  var hasS=S.students.length>0,hasC=!!ses||S.schedules.length>0;
  return '<section class="card"><h2 class="h2">Get started</h2><div class="steps">'
    +'<div class="step'+(hasS?' done':'')+'"><span class="n">'+(hasS?'&#10003;':'1')+'</span><div><strong>Add your classmates</strong><p>Paste your list, or register them as you scan their IDs. The name is only asked on the first scan.</p>'+(hasS?'':'<button class="btn sm" style="margin-top:8px" data-act="tab" data-t="ppl">Open Students</button>')+'</div></div>'
    +'<div class="step'+(hasC?' done':'')+'"><span class="n">'+(hasC?'&#10003;':'2')+'</span><div><strong>Add your class</strong><p>Set the subject and the days it meets, with a start and end time for each day. The start time decides when someone counts as late.</p>'+(hasC?'':'<button class="btn sm pri" style="margin-top:8px" data-act="newsched">Add class</button>')+'</div></div>'
    +'<div class="step"><span class="n">3</span><div><strong>Scan the QR on the ID</strong><p>Tap the big Scan button and point the camera at the QR. The time is recorded automatically.</p></div></div>'
    +'</div></section>';
}
function scanZone(ses){
  var dis=!ses||S.busy;
  return '<section class="scan-zone"><button class="scan-btn'+(S.busy?' busy':'')+'" type="button" data-act="scan"'+(dis?' disabled':'')+' aria-label="Open the QR scanner">'+BIGQR+'</button>'
    +'<div class="scan-cap"><strong>'+(S.busy?'Reading the QR...':'Tap to scan')+'</strong><span class="hint">Point the camera at the QR on the ID. It keeps scanning until you tap Done.</span></div>'
    +(ses?'<div class="pair"><button class="btn" data-act="focusq">Type instead</button><button class="btn" data-act="photo"'+(S.busy?' disabled':'')+'>Use a photo</button></div><button class="link" type="button" data-act="gallery"'+(S.busy?' disabled':'')+'>or choose a photo from your gallery</button>':'')+'</section>';
}
function manualCard(){
  return '<section class="card"><div><h3 class="h3">Enter manually</h3><p class="hint">QR will not scan? Type a name or the ID number.</p></div><div class="field-ic">'+IC.search+'<input type="text" id="f-q" value="'+esc(fv('f-q'))+'" autocomplete="off" autocapitalize="off" placeholder="Name or ID number" enterkeyhint="search"></div><div id="manual-results">'+manualResults()+'</div></section>';
}
function linkResults(){
  var q=String(S.f['f-newname']||'').trim().toLowerCase();
  var m=S.students.filter(function(s){return !s.c&&(!q||s.n.toLowerCase().indexOf(q)!==-1)}).slice(0,5);
  if(!m.length)return '';
  return '<div><p class="hint" style="margin-bottom:4px">Already on your list? Link the QR to a name:</p><ul class="rows">'+m.map(function(s){return '<li class="row"><span class="nm">'+esc(s.n)+'</span><button class="btn sm" data-act="link" data-i="'+s.i+'">Link</button></li>'}).join('')+'</ul></div>';
}
function lastResult(){
  var L=S.last,ses=active();if(!L||!ses)return '';
  if(L.kind==='fail')return '<section class="card res res-fail"><h3 class="h3">Could not read the QR</h3><p>Try again: move closer, fix the lighting, and make sure the whole QR is in the picture. Or type the name or ID number instead.</p><div class="acts"><button class="btn sm pri" data-act="focusq">Type instead</button><button class="btn sm" data-act="dismiss">Close</button></div></section>';
  if(L.kind==='new'&&isSec())return '<section class="card res"><div class="eyebrow">Not in the class list</div><h3 class="h3">This QR is not registered</h3><p class="hint">Ask your class admin to add this student, then tap Sync now in Settings.</p><button class="btn" data-act="dismiss">OK</button></section>';
  if(L.kind==='new')return '<section class="card res"><div class="eyebrow">New QR</div><h3 class="h3">This ID is not registered yet</h3><p class="raw mono">'+esc(L.raw.slice(0,90))+'</p><div><label for="f-newname">Student name</label><input type="text" id="f-newname" value="'+esc(fv('f-newname'))+'" autocomplete="off" autocapitalize="words" placeholder="Dela Cruz, Juan"></div><div id="link-results">'+linkResults()+'</div><div class="acts"><button class="btn pri" data-act="regnew">Register and time in</button><button class="btn" data-act="dismiss">Cancel</button></div></section>';
  var st=stuBy(L.i),rec=st&&recOf(ses,L.i);
  if(!st||!rec)return '';
  if(L.kind==='dup')return '<section class="card res res-dup"><div class="res-top"><div class="eyebrow">Already timed in</div>'+pill(rec.s)+'</div><div class="res-main">'+avatar(st.n)+'<div class="name">'+esc(st.n)+'</div></div><p class="mono">'+(rec.t&&rec.s!=='excused'?esc(fmtTime(rec.t)):'')+'</p></section>';
  var late=rec.s==='late';
  return '<section class="card res '+(late?'res-late':'res-ok')+'"><div class="res-top"><div class="eyebrow">'+(late?'Late':'Timed in')+'</div>'+pill(rec.s)+'</div><div class="res-main">'+avatar(st.n)+'<div class="name">'+esc(st.n)+'</div></div><div class="res-top"><span class="mono" style="font-size:18px;font-weight:500">'+(rec.t?esc(fmtTime(rec.t)):'')+'</span><button class="btn sm" data-act="removerec" data-i="'+st.i+'">Wrong? Remove</button></div></section>';
}
function manualResults(){
  var ses=active();if(!ses)return '';
  var raw=String(S.f['f-q']||'').trim(),q=raw.toLowerCase(),nq=norm(raw);
  if(!q)return '';
  var m=S.students.filter(function(s){return s.n.toLowerCase().indexOf(q)!==-1||(s.c&&norm(s.c).indexOf(nq)!==-1)}).slice(0,6);
  if(!m.length)return '<div class="nomatch"><p class="hint">No student matches "'+esc(raw)+'".</p><button class="btn sm" data-act="regmanual">Add as a new student and time in</button></div>';
  return '<ul class="rows">'+m.map(function(s){
    var r=recOf(ses,s.i);
    return '<li class="row">'+avatar(s.n)+'<span class="nm">'+esc(s.n)+(s.c?'<span class="sub code">'+esc(s.c)+'</span>':'')+'</span>'+(r?'<span class="rt">'+(r.t&&r.s!=='excused'?'<span class="tm">'+esc(fmtTime(r.t))+'</span>':'')+pill(r.s)+'</span>':'<button class="btn sm pri" data-act="timein" data-i="'+s.i+'">Time in</button>')+'</li>';
  }).join('')+'</ul>';
}
function viewScan(){
  var ses=active(),h='';
  h+=installCard();
  if(!ses||!S.students.length)h+=setupCard(ses);
  h+=todayCard();
  if(ses)h+=sessionCard(ses);
  h+=scanZone(ses);
  h+=lastResult();
  if(ses)h+=manualCard();
  return h;
}
function rowHTML(x){
  var st=x.st,rec=x.rec,open=S.expanded===st.i;
  var right=rec?(rec.t&&rec.s!=='excused'?'<span class="tm">'+esc(fmtTime(rec.t))+'</span>':'')+pill(rec.s):pill('absent');
  var acts='';
  if(open){
    if(rec){
      acts='<div class="acts">'+['present','late','excused'].filter(function(s){return s!==rec.s}).map(function(s){return '<button class="btn sm" data-act="setstatus" data-i="'+st.i+'" data-s="'+s+'">Mark '+LBL[s]+'</button>'}).join('')+'<button class="btn sm bad" data-act="removerec" data-i="'+st.i+'">Remove record</button></div>';
    }else{
      acts='<div class="acts"><button class="btn sm pri" data-act="timein" data-i="'+st.i+'">Time in</button><button class="btn sm" data-act="setstatus" data-i="'+st.i+'" data-s="excused">Excused</button></div>';
    }
  }
  return '<li><button class="row-btn" data-act="expand" data-i="'+st.i+'" aria-expanded="'+open+'">'+avatar(st.n)+'<span class="nm">'+esc(st.n)+(rec&&rec.m==='manual'&&rec.s!=='excused'?'<span class="sub hint">manual</span>':'')+'</span><span class="rt">'+right+'</span></button>'+acts+'</li>';
}
function viewList(){
  var ses=active();
  if(!ses)return empty('No class yet','Add a class to see the attendance list.','Add class','newsched');
  if(!S.students.length)return empty('No students yet','Add your classmates to see who is present here.','Open Students','tab','data-t="ppl"');
  var c=classify(ses),f=S.filter,rows;
  var rec=c.p.concat(c.l,c.e).sort(byTimeDesc);
  if(f==='present')rows=c.p.slice().sort(byTimeDesc);
  else if(f==='late')rows=c.l.slice().sort(byTimeDesc);
  else if(f==='excused')rows=c.e;
  else if(f==='absent')rows=c.a;
  else rows=rec.concat(c.a);
  var F=[['all','All'],['present','Present'],['late','Late'],['excused','Excused'],['absent','Not yet']];
  return '<div class="head-row"><div><div class="eyebrow">'+esc(fmtDate(ses.date))+'</div><h2 class="h2">'+esc(ses.subject)+'</h2></div></div>'
    +'<div class="stats"><div class="stat s-p"><b>'+c.p.length+'</b><span>Present</span></div><div class="stat s-l"><b>'+c.l.length+'</b><span>Late</span></div><div class="stat s-e"><b>'+c.e.length+'</b><span>Excused</span></div><div class="stat s-a"><b>'+c.a.length+'</b><span>Not yet</span></div></div>'
    +'<div class="filters">'+F.map(function(x){return '<button class="f" data-act="filter" data-f="'+x[0]+'" aria-pressed="'+(f===x[0])+'">'+x[1]+'</button>'}).join('')+'</div>'
    +'<section class="card card-flat">'+(rows.length?'<ul class="rows">'+rows.map(rowHTML).join('')+'</ul>':'<p class="muted" style="padding:12px 0">Nobody in this category.</p>')+'</section>'
    +'<div class="acts"><button class="btn" data-act="export" data-id="'+ses.id+'">Save file</button><button class="btn" data-act="copysum" data-id="'+ses.id+'">Copy summary</button>'+(S.gs&&S.gs.url?'<button class="btn" data-act="gssend" data-id="'+ses.id+'">Send to Google Sheets</button>':'')+'</div>';
}
function meetingsOf(x){return sortedSessions('desc').filter(function(s){return s.sch===x.id})}
function meetingRow(s){
  var st=statsOf(s),isA=s.id===S.activeId,key='del:'+s.id;
  return '<li class="mrow"><div style="min-width:0"><span class="nm">'+esc(fmtDate(s.date))+(isA?' <span class="pill p-present">Active</span>':'')+'</span><span class="sub hint">'+esc(fmt12(s.start))+(s.end?' to '+esc(fmt12(s.end)):'')+' &middot; Present '+st.p+' &middot; Late '+st.l+' &middot; Excused '+st.e+' &middot; Not yet '+st.a+'</span></div>'
    +'<div class="acts"><button class="btn sm pri" data-act="opensession" data-id="'+s.id+'">'+(isA?'View list':'Open')+'</button><button class="btn sm" data-act="export" data-id="'+s.id+'">Save</button><button class="btn sm bad" data-act="delsession" data-id="'+s.id+'">'+(S.confirm===key?'Sure? Tap again':'Delete')+'</button></div></li>';
}
function classData(x){
  var ms=meetingsOf(x).slice().reverse();
  var rows=S.students.map(function(st){
    var p=0,l=0,e=0,a=0,cells=ms.map(function(s){var r=recOf(s,st.i),c=!r?'A':r.s==='late'?'L':r.s==='excused'?'E':'P';if(c==='P')p++;else if(c==='L')l++;else if(c==='E')e++;else a++;return c});
    var d=p+l+a;return {st:st,cells:cells,p:p,l:l,e:e,a:a,rate:d?Math.round((p+l)/d*100):null};
  });
  return {ms:ms,rows:rows};
}
function classReportHTML(x){
  var cd=classData(x);
  if(!cd.ms.length)return '<p class="hint">No meetings yet, so there is nothing to report.</p>';
  if(!cd.rows.length)return '<p class="hint">Add students to see the class list.</p>';

    +cd.rows.slice().sort(function(a,b){return b.a-a.a||a.st.n.localeCompare(b.st.n)}).map(function(r){return '<tr><td>'+esc(r.st.n)+'</td><td>'+r.p+'</td><td>'+r.l+'</td><td>'+r.e+'</td><td>'+r.a+'</td><td>'+(r.rate==null?'-':r.rate+'%')+'</td></tr>'}).join('')+'</tbody></table></div>';

function renderSheet(){
  var el=$('#sheet'),sh=S.sheet;
  if(!sh){el.innerHTML='';return}
  var body='';
  if(sh.type==='class'){
    var last=sortedSessions('desc')[0];
    body='<form class="fields" data-form="newclass"><h2 class="h2">One-time session</h2>'
      +'<div><label for="f-subj">Subject</label><input type="text" id="f-subj" value="'+esc(fv('f-subj',last?last.subject:''))+'" placeholder="e.g. Math 101" autocomplete="off"></div>'
      +'<div><label for="f-date">Date</label><input type="date" id="f-date" value="'+esc(fv('f-date',todayStr()))+'"></div>'
      +'<div class="grid2"><div><label for="f-start">Start time</label><input type="time" id="f-start" value="'+esc(fv('f-start',last?last.start:'07:30'))+'"></div><div><label for="f-end">End time</label><input type="time" id="f-end" value="'+esc(fv('f-end',last&&last.end?last.end:'09:00'))+'"></div></div><div><label for="f-grace">Grace period (minutes)</label><input type="number" id="f-grace" min="0" max="120" inputmode="numeric" value="'+esc(fv('f-grace',last?last.grace:10))+'"></div>'
      +'<p class="hint">Time-ins after the start time plus the grace period count as late.</p>'
      +(S.err?'<p class="err">'+esc(S.err)+'</p>':'')
      +'<div class="acts"><button class="btn pri" type="submit">Create</button><button class="btn" type="button" data-act="closesheet">Cancel</button></div></form>';
  }else if(sh.type==='sched'){body=schedForm();}else if(sh.type==='export'){body=exportBody(sh);}else if(sh.type==='text'){
    body='<div class="fields"><h2 class="h2">'+esc(sh.title)+'</h2><p class="hint">'+esc(sh.hint||'Could not save directly. Copy the text below.')+'</p><textarea id="f-copy" readonly style="min-height:200px">'+esc(sh.text)+'</textarea><div class="acts"><button class="btn pri" data-act="copyarea">Copy</button><button class="btn" data-act="closesheet">Close</button></div></div>';
  }
  el.innerHTML='<div class="sheet" role="dialog" aria-modal="true"><div class="sheet-bg" data-act="closesheet"></div><div class="sheet-p">'+body+'</div></div>';
  if(sh.type==='text')setTimeout(function(){var ta=$('#f-copy');if(ta){ta.focus();ta.select()}},0);
}

/* ---------- actions ---------- */
var SEC_BLOCK={newsched:1,newclass:1,delsched:1,delsession:1,regmanual:1,importtoggle:1,gsoff:1};
function act(a,d){
  if(isSec()&&SEC_BLOCK[a]){toast('Only the class admin can do that.');return}
  switch(a){
    case 'clsrep':S.clsRep=S.clsRep||{};S.clsRep[d.id]=!S.clsRep[d.id];render();break;
    case 'secpull':gsFlush().then(function(){gsPullAt=0;gsPull(false)});break;
        case 'secout':if(arm('secout'))secOut();else render();break;
    case 'gsreports':cfgPush(true).then(function(){return gsPost({action:'rebuild'})}).then(function(r){toast(r&&r.v!==3?'Update your script first.':'Class tabs updated in your sheet.')});toast('Updating class tabs...');break;
    case 'tab':S.tab=d.t;S.expanded=null;S.confirm=null;S.err='';window.scrollTo(0,0);render();break;
    case 'scan':camStart();break;
    case 'photo':$('#f-cam').click();break;
    case 'camstop':camStop();render();break;
    case 'gallery':$('#f-gal').click();break;
    case 'scanreg':$('#f-reg').click();break;
    case 'newclass':S.sheet={type:'class'};S.err='';renderSheet();break;
    case 'closesheet':S.sheet=null;S.err='';renderSheet();break;
    case 'dismiss':S.last=null;render();break;
    case 'copyarea':{var ta=$('#f-copy');if(ta){ta.focus();ta.select();try{document.execCommand('copy');toast('Copied.')}catch(e){}}break}
    case 'timein':{
      var st=stuBy(d.i),r=markIn(d.i,'manual');
      if(r&&st){if(r.dup)toast(st.n+' is already timed in.');else{toast('Time in: '+st.n);if(S.tab==='scan'){S.last={kind:'ok',i:d.i};S.f['f-q']=''}}}
      S.expanded=null;render();break;
    }
    case 'setstatus':setStatus(d.i,d.s);S.expanded=null;render();break;
    case 'removerec':removeRec(d.i);if(S.last&&S.last.i===d.i)S.last=null;S.expanded=null;render();break;
    case 'expand':S.expanded=S.expanded===d.i?null:d.i;S.confirm=null;delete S.f['f-rn'];render();break;
    case 'filter':S.filter=d.f;S.expanded=null;render();break;
    case 'opensession':setActive(d.id);S.tab='list';S.last=null;S.expanded=null;window.scrollTo(0,0);render();break;
    case 'delsession':
      if(arm('del:'+d.id)){
        delete S.sessions[d.id];removeSessionStore(d.id);
        if(S.activeId===d.id){S.activeId=null;pickActive();ls.set('talaan-active',S.activeId||'')}
        toast('Class deleted.');render();
      }break;
    case 'export':S.sheet={type:'export',id:d.id};renderSheet();break;
    case 'dl':S.sheet=null;renderSheet();doExport(d.id,d.fmt);break;
    case 'copysum':{var s2=S.sessions[d.id];if(s2)copyText(summaryText(s2));break}
    case 'regnew':{
      var nm=String(S.f['f-newname']||'').trim(),raw=S.last&&S.last.raw;
      if(!nm){toast('Enter a name first.');break}
      var res=addStudent(nm,raw||'');
      if(typeof res==='string'){toast(res);break}
      markIn(res.i,'qr');S.last={kind:'ok',i:res.i};S.f['f-newname']='';render();break;
    }
    case 'link':{
      var raw2=S.last&&S.last.raw,t=stuBy(d.i);
      if(!t||!raw2)break;
      if(S.students.some(function(s){return s.c&&norm(s.c)===norm(raw2)})){toast('This QR is already in use.');break}
      S.students=S.students.map(function(s){return s.i===t.i?{i:s.i,n:s.n,c:raw2}:s});persistRoster();
      markIn(t.i,'qr');S.last={kind:'ok',i:t.i};render();break;
    }
    case 'delstudent':
      if(arm('ds:'+d.i)){
        S.students=S.students.filter(function(s){return s.i!==d.i});persistRoster();S.expanded=null;toast('Removed from list.');render();
      }break;
    case 'renamesave':{
      var v=String(S.f['f-rn']||'').trim().replace(/\s+/g,' ');
      if(!v){toast('Enter a name.');break}
      S.students=S.students.map(function(s){return s.i===d.i?{i:s.i,n:v,c:s.c}:s});sortStudents();persistRoster();S.expanded=null;delete S.f['f-rn'];toast('Saved.');render();break;
    }
    case 'newsched':S.sheet={type:'sched'};S.err='';renderSheet();break;
    case 'delsched':
      if(arm('dsc:'+d.id)){S.schedules=S.schedules.filter(function(x){return x.id!==d.id});persistRoster();toast('Class removed. Past meetings are kept.');render()}
      break;
    case 'startsched':{
      var sc=S.schedules.find(function(x){return x.id===d.id});if(!sc)break;
      var tdy=todayStr(),exs=sortedSessions('desc').find(function(s){return s.sch===sc.id&&s.date===tdy}),sid;
      if(exs){sid=exs.id}else{
        sid=uid('s');
        var sl=slotOf(sc,new Date().getDay())||sc.slots[0];
        S.sessions[sid]={id:sid,date:tdy,subject:sc.subject,start:sl.start,end:sl.end||'',grace:sc.grace,created:Date.now(),sch:sc.id,records:[]};
        persistSession(sid);
      }
      setActive(sid);S.last=null;S.tab='scan';window.scrollTo(0,0);render();toast('Class started: '+sc.subject);break;
    }
    case 'switchsess':setActive(d.id);S.last=null;render();toast('Switched class.');break;
    case 'install':{var ev=S.installEvt;if(ev){ev.prompt();ev.userChoice.then(function(){S.installEvt=null;render()},function(){S.installEvt=null;render()})}break}
    case 'gssend':{var gse=S.sessions[d.id];if(gse){gsSync(gse,true,true);toast('Sending to Google Sheets...')}break}
    case 'gstest':gsTest();break;
    case 'gsretry':gsFlush();toast('Sending...');break;
    case 'gscopy':copyText(gsScript(S.gs.token));break;
    case 'gscode':copyText(gsCode());break;
    case 'gstoggle':S.gsOpen=!S.gsOpen;render();break;
    case 'gssave':gsSave();break;
    case 'gsoff':if(arm('gsoff')){S.gs.url='';saveGs();S.gsOpen=false;toast('Disconnected.');render()}break;
    case 'fab':if(S.tab==='scan'){camStart()}else{S.tab='scan';S.expanded=null;S.confirm=null;S.err='';window.scrollTo(0,0);render()}break;
    case 'focusq':{var qi=$('#f-q');if(qi){qi.scrollIntoView({block:'center',behavior:'smooth'});qi.focus()}break}
    case 'camtype':camStop();S.tab='scan';render();window.scrollTo(0,0);setTimeout(function(){var q3=$('#f-q');if(q3){q3.scrollIntoView({block:'center'});q3.focus()}},60);break;
    case 'regmanual':{
      var nm2=String(S.f['f-q']||'').trim();if(!nm2)break;
      var rs=addStudent(nm2,'');if(typeof rs==='string'){toast(rs);break}
      markIn(rs.i,'manual');S.last={kind:'ok',i:rs.i};S.f['f-q']='';toast('Added '+rs.n+' and timed in.');render();break;
    }
    case 'allmeet':S.allMeet=S.allMeet||{};S.allMeet[d.id]=!S.allMeet[d.id];render();break;
    case 'importtoggle':S.importOpen=!S.importOpen;render();break;
  }
}
function submitForm(name){
  if(name==='login'){doLogin();return}
  if(isSec()){toast('Only the class admin can do that.');return}
  if(name==='newclass'){
    var subj=$('#f-subj').value.trim(),date=$('#f-date').value,start=$('#f-start').value,end=$('#f-end').value,grace=parseInt($('#f-grace').value,10);
    if(!subj){S.err='Enter the subject.';renderSheet();return}
    if(!date||!start){S.err='Fill in the date and time.';renderSheet();return}
    if(!end||end<=start){S.err='End time must be after the start time.';renderSheet();return}
    var id=uid('s');
    S.sessions[id]={id:id,date:date,subject:subj,start:start,end:end,grace:isNaN(grace)?10:Math.max(0,Math.min(120,grace)),created:Date.now(),records:[]};
    persistSession(id);setActive(id);S.sheet=null;S.err='';S.tab='scan';S.last=null;
    ['f-subj','f-date','f-start','f-end','f-grace'].forEach(function(k){delete S.f[k]});
    renderSheet();window.scrollTo(0,0);render();toast('Session created.');
  }else if(name==='newsched'){
    var sj=$('#f-ssubj').value.trim(),sg=parseInt($('#f-sgrace').value,10),slots=[],bad='';
    DAY_ORDER.forEach(function(k){
      if(!$('#f-day-'+k).checked)return;
      var a=$('#f-ds-'+k).value,b=$('#f-de-'+k).value;
      if(!a||!b||b<=a){bad=bad||('End time must be after the start time on '+DAYS[k]+'.');return}
      slots.push({d:k,start:a,end:b});
    });
    if(!sj){S.err='Enter the subject.';renderSheet();return}
    if(bad){S.err=bad;renderSheet();return}
    if(!slots.length){S.err='Pick at least one day.';renderSheet();return}
    S.schedules=S.schedules.concat([{id:uid('sc'),subject:sj,slots:slots,grace:isNaN(sg)?10:Math.max(0,Math.min(120,sg))}]);
    persistRoster();S.sheet=null;S.err='';
    ['f-ssubj','f-sgrace'].concat([0,1,2,3,4,5,6].reduce(function(a,k){return a.concat(['f-day-'+k,'f-ds-'+k,'f-de-'+k])},[])).forEach(function(k){delete S.f[k]});
    renderSheet();render();toast('Class added.');
  }else if(name==='section'){
    S.section=String($('#f-section').value||'').trim();persistRoster();delete S.f['f-section'];toast('Section saved.');render();
  }else if(name==='addstudent'){
    var res=addStudent($('#f-name').value,$('#f-code').value);
    if(typeof res==='string'){S.err=res;render();return}
    S.err='';S.f['f-name']='';S.f['f-code']='';toast('Added '+res.n+'.');render();
  }else if(name==='import'){
    var r=doImport($('#f-import').value);
    S.f['f-import']='';S.importOpen=false;toast('Added: '+r.added+(r.skipped?' | skipped: '+r.skipped:''));render();
  }
}

/* ---------- wiring ---------- */
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  act(b.dataset.act,b.dataset);
});
document.addEventListener('input',function(e){
  var t=e.target;if(!t.id||!t.matches('input,textarea,select'))return;
  S.f[t.id]=t.type==='checkbox'?t.checked:t.value;
  if(t.id==='f-q')partial('manual-results',manualResults);
  else if(t.id==='f-newname')partial('link-results',linkResults);
  else if(t.id==='f-sq')partial('roster-results',rosterResults);
});
document.addEventListener('submit',function(e){e.preventDefault();var n=e.target.dataset&&e.target.dataset.form;if(n)submitForm(n)});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&S.sheet){S.sheet=null;renderSheet()}});
function bindFile(id,mode){
  var el=document.getElementById(id);
  el.addEventListener('change',function(){var f=el.files&&el.files[0];el.value='';scanFile(f,mode)});
}
bindFile('f-cam','scan');bindFile('f-gal','scan');bindFile('f-reg','reg');

window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();S.installEvt=e;if(!S.loading&&S.tab==='scan')render()});
window.addEventListener('appinstalled',function(){S.installEvt=null;render()});
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}

init();
})();
</script>
</body>
</html>
