<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Talaan</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone-first shell. Sticky header, one screen at a time, fixed bottom tabs. The QR viewfinder button is the one bold element; everything else stays quiet. */
:root{
  color-scheme:light;
  --bg:#EDF0F7; --surface:#FFFFFF; --surface-2:#E3E8F3; --fg:#121B33; --muted:#566180; --line:#CED5E6;
  --accent:#2845D6; --accent-fg:#FFFFFF; --accent-soft:#DDE4FF;
  --ok:#16794C; --ok-bg:#DCF2E6; --late:#8A5200; --late-bg:#FFEBC7; --exc:#3C5A99; --exc-bg:#DDE7FB; --bad:#B3302F; --bad-bg:#FADCDC;
  --shade:rgba(10,16,34,.5);
  --display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1322; --surface:#161E36; --surface-2:#1F2948; --fg:#E7ECF8; --muted:#98A3C4; --line:#2B3659;
    --accent:#8CA4FF; --accent-fg:#0D1322; --accent-soft:#232F5E;
    --ok:#5FD39A; --ok-bg:#123526; --late:#F2B35A; --late-bg:#3B2A0E; --exc:#9DB6F2; --exc-bg:#1C2A4D; --bad:#FF8E8B; --bad-bg:#3F1B1F;
    --shade:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1322; --surface:#161E36; --surface-2:#1F2948; --fg:#E7ECF8; --muted:#98A3C4; --line:#2B3659;
  --accent:#8CA4FF; --accent-fg:#0D1322; --accent-soft:#232F5E;
  --ok:#5FD39A; --ok-bg:#123526; --late:#F2B35A; --late-bg:#3B2A0E; --exc:#9DB6F2; --exc-bg:#1C2A4D; --bad:#FF8E8B; --bad-bg:#3F1B1F;
  --shade:rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:30}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p,ul{margin:0}
ul{padding:0;list-style:none}
.in{width:100%;max-width:560px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.hint{color:var(--muted);font-size:13px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .in{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{flex:none}
.brand-name{font-family:var(--display);font-stretch:118%;font-weight:800;font-size:19px;letter-spacing:.01em;line-height:1.1}
.brand-sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:36vw}
.chip{display:inline-flex;align-items:center;gap:6px;max-width:52%;min-height:36px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface-2);font-size:13px;font-weight:600}
.chip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.banner{background:var(--late-bg);color:var(--late);font-size:13px;padding-block:8px;font-weight:500}

/* shell */
main.in{padding-top:16px;padding-bottom:112px;display:flex;flex-direction:column;gap:14px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .in{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding-block:6px}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border:0;background:none;color:var(--muted);font-size:11.5px;font-weight:600;border-radius:10px;min-height:52px}
.tab[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}

/* generic */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card-flat{padding-block:6px}
.h2{font-family:var(--display);font-stretch:110%;font-weight:800;font-size:20px;line-height:1.15;text-wrap:balance}
.h3{font-family:var(--display);font-stretch:106%;font-weight:700;font-size:16.5px;line-height:1.2;text-wrap:balance}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.head-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:9px 16px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface-2);font-weight:600;font-size:14.5px;text-align:center}
.btn.sm{min-height:38px;padding:6px 13px;font-size:13.5px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.bad{background:var(--bad-bg);border-color:transparent;color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;align-items:center;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.p-present{background:var(--ok-bg);color:var(--ok)}
.p-late{background:var(--late-bg);color:var(--late)}
.p-excused{background:var(--exc-bg);color:var(--exc)}
.p-absent{background:var(--surface-2);color:var(--muted)}
.p-noqr{background:var(--late-bg);color:var(--late)}
label{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
input[type=text],input[type=date],input[type=time],input[type=number],textarea{width:100%;min-height:46px;padding:10px 12px;font-size:16px;background:var(--bg);border:1.5px solid var(--line);border-radius:10px}
textarea{min-height:120px;resize:vertical;font-family:var(--mono);font-size:14px}
.fields{display:flex;flex-direction:column;gap:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.inline{display:flex;gap:8px;align-items:flex-end}
.inline>div{flex:1;min-width:0}
.err{color:var(--bad);font-size:13px;font-weight:600}

/* viewfinder */
.vf{position:relative;display:grid;place-items:center;width:min(100%,290px);aspect-ratio:1;margin-inline:auto;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:0;overflow:hidden}
.vf i{position:absolute;width:46px;height:46px;border:6px solid var(--accent)}
.vf i:nth-child(1){top:16px;left:16px;border-right:0;border-bottom:0;border-top-left-radius:16px}
.vf i:nth-child(2){top:16px;right:16px;border-left:0;border-bottom:0;border-top-right-radius:16px}
.vf i:nth-child(3){bottom:16px;left:16px;border-right:0;border-top:0;border-bottom-left-radius:16px}
.vf i:nth-child(4){bottom:16px;right:16px;border-left:0;border-top:0;border-bottom-right-radius:16px}
.vf-label{display:flex;flex-direction:column;align-items:center;gap:10px;padding:0 44px;text-align:center;font-weight:700;font-size:15px;line-height:1.3}
.vf-label svg{color:var(--accent)}
.vf[disabled]{opacity:.55}
.scanline{position:absolute;left:22px;right:22px;top:22px;height:3px;border-radius:3px;background:var(--accent);opacity:.9}
@media (prefers-reduced-motion:no-preference){
  .vf.busy .scanline{animation:sweep 1.1s ease-in-out infinite alternate}
}
@keyframes sweep{from{top:24px}to{top:calc(100% - 27px)}}
.under-vf{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.link{background:none;border:0;color:var(--accent);font-weight:600;font-size:14px;text-decoration:underline;padding:6px;min-height:36px}

/* session card */
.sess-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.bar{height:8px;border-radius:8px;background:var(--surface-2);overflow:hidden}
.bar b{display:block;height:100%;background:var(--ok);border-radius:8px}
.meta{font-size:13px;color:var(--muted)}

/* result */
.res{border-width:1.5px}
.res-ok{border-color:var(--ok);background:var(--ok-bg)}
.res-late{border-color:var(--late);background:var(--late-bg)}
.res-dup{border-color:var(--exc);background:var(--exc-bg)}
.res-fail{border-color:var(--bad);background:var(--bad-bg)}
.res .name{font-family:var(--display);font-stretch:108%;font-weight:800;font-size:24px;line-height:1.15;text-wrap:balance}
.res-top{display:flex;justify-content:space-between;gap:10px;align-items:center}
.raw{font-size:13px;word-break:break-all;background:var(--bg);border-radius:8px;padding:8px 10px}

/* setup */
.steps{display:flex;flex-direction:column;gap:10px}
.step{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}
.step .n{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--surface-2);font-weight:700;font-size:13px}
.step.done .n{background:var(--ok-bg);color:var(--ok)}
.step p{font-size:13.5px;color:var(--muted)}
.step strong{display:block;font-size:14.5px}

/* stats and lists */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center}
.stat b{display:block;font-family:var(--display);font-stretch:110%;font-weight:800;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.stat.s-p b,.stat.s-p span{color:var(--ok)}
.stat.s-l b,.stat.s-l span{color:var(--late)}
.stat.s-e b,.stat.s-e span{color:var(--exc)}
.stat.s-a b,.stat.s-a span{color:var(--muted)}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.f{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:13px;font-weight:600;min-height:36px}
.f[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.rows>li{border-bottom:1px solid var(--line)}
.rows>li:last-child{border-bottom:0}
.row-btn{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;background:none;border:0;padding:12px 0;text-align:left;min-height:52px}
.row-btn .nm,.row .nm{font-weight:600;min-width:0;overflow-wrap:anywhere}
.rt{display:flex;align-items:center;gap:8px;flex:none}
.tm{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;color:var(--muted)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;min-height:52px}
.row-wrap .acts{padding-bottom:12px}
.code{font-family:var(--mono);font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.sub{display:block;font-weight:400}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal;min-width:130px}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.empty{align-items:flex-start}

.days{display:flex;flex-wrap:wrap;gap:8px}
.daybox{display:inline-flex;align-items:center;gap:8px;margin:0;font-size:14px;font-weight:600;min-height:44px;padding:6px 14px;border:1.5px solid var(--line);border-radius:999px;background:var(--surface);cursor:pointer}
.daybox input{width:18px;height:18px;margin:0;accent-color:var(--accent)}
#cam{position:fixed;inset:0;z-index:80;background:#000;display:flex;flex-direction:column}
#cam-v{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cam-frame{position:absolute;left:50%;top:38%;width:min(68vw,320px);aspect-ratio:1;transform:translate(-50%,-50%)}
.cam-frame i{position:absolute;width:38px;height:38px;border:5px solid #fff;filter:drop-shadow(0 0 3px rgba(0,0,0,.6))}
.cam-frame i:nth-child(1){top:0;left:0;border-right:0;border-bottom:0;border-top-left-radius:14px}
.cam-frame i:nth-child(2){top:0;right:0;border-left:0;border-bottom:0;border-top-right-radius:14px}
.cam-frame i:nth-child(3){bottom:0;left:0;border-right:0;border-top:0;border-bottom-left-radius:14px}
.cam-frame i:nth-child(4){bottom:0;right:0;border-left:0;border-top:0;border-bottom-right-radius:14px}
.cam-panel{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:20px 20px 0 0;display:flex;flex-direction:column;gap:12px;padding-top:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.cam-msg{border-radius:12px;padding:12px 14px;background:var(--surface-2);min-height:72px}
.cam-msg.ok{background:var(--ok-bg);color:var(--ok)}
.cam-msg.late{background:var(--late-bg);color:var(--late)}
.cam-msg.dup{background:var(--exc-bg);color:var(--exc)}
.cam-t{font-family:var(--display);font-stretch:108%;font-weight:800;font-size:22px;line-height:1.15;overflow-wrap:anywhere}
.cam-s{font-size:14px;margin-top:2px;font-variant-numeric:tabular-nums}
/* sheet and toast */
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg{position:absolute;inset:0;background:var(--shade)}
.sheet-p{position:relative;width:100%;max-width:560px;max-height:92%;overflow:auto;background:var(--surface);border-radius:20px 20px 0 0;padding-top:20px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:90;max-width:min(92vw,420px);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;text-align:center}
#toast.show{opacity:1}
body:has(#cam:not([hidden])) #toast{bottom:auto;top:calc(16px + env(safe-area-inset-top,0px))}
</style>
</head>
<body>

<div id="app"></div>
<div id="sheet"></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="cam" hidden>
  <video id="cam-v" playsinline muted autoplay></video>
  <div class="cam-frame" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <div class="cam-panel">
    <div id="cam-msg" class="cam-msg idle" aria-live="polite"></div>
    <button class="btn pri" type="button" data-act="camstop">Done</button>
  </div>
</div>
<input id="f-cam" type="file" accept="image/*" capture="environment" hidden>
<input id="f-gal" type="file" accept="image/*" hidden>
<input id="f-reg" type="file" accept="image/*" capture="environment" hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<script>
(function(){
'use strict';

/* ---------- helpers ---------- */
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var pad=function(n){return String(n).padStart(2,'0')};
var todayStr=function(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
var uid=function(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,5)};
var ls={get:function(k){try{return localStorage.getItem(k)}catch(e){return null}},set:function(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
var norm=function(s){return String(s==null?'':s).trim().toLowerCase().replace(/\s+/g,'')};
var LBL={present:'Present',late:'Late',excused:'Excused',absent:'Not yet'};

function fmtTime(iso){try{return new Date(iso).toLocaleTimeString('en-PH',{hour:'numeric',minute:'2-digit'})}catch(e){return ''}}
function parseDate(s){var p=String(s||'').split('-').map(Number);return new Date(p[0],(p[1]||1)-1,p[2]||1)}
function fmtDate(s){try{return parseDate(s).toLocaleDateString('en-PH',{weekday:'short',month:'short',day:'numeric',year:'numeric'})}catch(e){return s}}
function shortDate(s){try{return parseDate(s).toLocaleDateString('en-PH',{month:'short',day:'numeric'})}catch(e){return s}}
function fmt12(hhmm){var p=String(hhmm||'').split(':').map(Number);if(isNaN(p[0]))return hhmm||'';var d=new Date(2000,0,1,p[0],p[1]||0);return d.toLocaleTimeString('en-PH',{hour:'numeric',minute:'2-digit'})}

function ico(inner){return '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+inner+'</svg>'}
var IC={
  scan:ico('<path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><path d="M8 12h8"/>'),
  list:ico('<path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/>'),
  cls:ico('<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>'),
  ppl:ico('<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6M16 4.8a3.5 3.5 0 0 1 0 6.4M18 14.4c2 .7 3.5 2.6 3.5 5.6"/>')
};
var BIGQR='<svg viewBox="0 0 48 48" width="52" height="52" fill="currentColor" aria-hidden="true"><path d="M6 6h14v14H6zM10 10v6h6v-6zM28 6h14v14H28zM32 10v6h6v-6zM6 28h14v14H6zM10 32v6h6v-6zM28 28h5v5h-5zM37 28h5v5h-5zM28 37h5v5h-5zM37 37h5v5h-5zM33 33h4v4h-4z"/></svg>';
var MARK='<svg viewBox="0 0 28 28" width="30" height="30" aria-hidden="true"><rect width="28" height="28" rx="7" fill="var(--accent)"/><g fill="var(--accent-fg)"><rect x="5" y="5" width="7" height="7" rx="1.5"/><rect x="16" y="5" width="7" height="7" rx="1.5"/><rect x="5" y="16" width="7" height="7" rx="1.5"/><rect x="16" y="16" width="3.5" height="3.5"/><rect x="19.5" y="19.5" width="3.5" height="3.5"/></g></svg>';

/* ---------- state ---------- */
var S={
  tab:'scan',loading:true,mode:'loading',banner:'',
  students:[],section:'',schedules:[],sessions:{},activeId:ls.get('talaan-active'),
  f:{},filter:'all',expanded:null,confirm:null,ct:null,
  sheet:null,err:'',last:null,busy:false,importOpen:false,
  db:null,dl:null
};

/* ---------- storage ---------- */
function sortStudents(){S.students.sort(function(a,b){return a.n.localeCompare(b.n,'en',{sensitivity:'base'})})}
function cmpSess(a,b){return a.date<b.date?-1:a.date>b.date?1:(a.created||0)-(b.created||0)}
function sortedSessions(dir){var a=Object.keys(S.sessions).map(function(k){return S.sessions[k]}).sort(cmpSess);return dir==='asc'?a:a.reverse()}
function pickActive(){
  if(S.activeId&&S.sessions[S.activeId])return;
  var a=sortedSessions('desc');S.activeId=a.length?a[0].id:null;
}
function setActive(id){S.activeId=id;ls.set('talaan-active',id||'')}
function sessionDoc(s){return {date:s.date,subject:s.subject,start:s.start,grace:s.grace,created:s.created||0,records:s.records,sch:s.sch||''}}
function saveLocal(){ls.set('talaan-data',JSON.stringify({students:S.students,section:S.section,schedules:S.schedules,sessions:S.sessions}))}
function loadLocal(){
  try{
    var d=JSON.parse(ls.get('talaan-data')||'null');
    if(d){S.students=d.students||[];S.section=d.section||'';S.sessions=d.sessions||{};S.schedules=d.schedules||[];}
  }catch(e){}
  sortStudents();
}
var queues={};

/* ---------- domain ---------- */
function active(){return S.activeId?S.sessions[S.activeId]:null}
function stuBy(i){return S.students.find(function(s){return s.i===i})}
function recOf(ses,i){return ses.records.find(function(r){return r.i===i})}
function lateAt(ses){var d=parseDate(ses.date),t=String(ses.start||'00:00').split(':').map(Number);return new Date(d.getFullYear(),d.getMonth(),d.getDate(),t[0]||0,(t[1]||0)+Number(ses.grace||0))}
function statusNow(ses){return new Date()>lateAt(ses)?'late':'present'}
function findStudent(raw){
  var n=norm(raw);if(!n)return null;
  var withCode=S.students.filter(function(s){return s.c});
  var hit=withCode.find(function(s){return norm(s.c)===n});
  if(hit)return hit;
  return withCode.find(function(s){var c=norm(s.c);return c.length>=4&&n.indexOf(c)!==-1})||null;
}
function markIn(i,method){
  var ses=active();
  if(!ses){toast('Create a class first.');return null}
  var ex=recOf(ses,i);if(ex)return {dup:true,rec:ex};
  var rec={i:i,t:new Date().toISOString(),m:method,s:statusNow(ses)};
  ses.records=ses.records.concat([rec]);persistSession(ses.id);
  return {rec:rec};
}
function setStatus(i,s){
  var ses=active();if(!ses)return;
  var ex=recOf(ses,i);
  if(ex){
    ses.records=ses.records.map(function(r){if(r.i!==i)return r;var t=r.t;if(!t&&s!=='excused')t=new Date().toISOString();return {i:r.i,t:t,m:r.m,s:s}});
  }else{
    ses.records=ses.records.concat([{i:i,t:s==='excused'?null:new Date().toISOString(),m:'manual',s:s}]);
  }
  persistSession(ses.id);
}
function removeRec(i){
  var ses=active();if(!ses)return;
  ses.records=ses.records.filter(function(r){return r.i!==i});persistSession(ses.id);
}
function classify(ses){
  var by=new Map(ses.records.map(function(r){return [r.i,r]}));
  var o={p:[],l:[],e:[],a:[]};
  S.students.forEach(function(st){
    var r=by.get(st.i),x={st:st,rec:r||null};
    if(!r)o.a.push(x);else if(r.s==='late')o.l.push(x);else if(r.s==='excused')o.e.push(x);else o.p.push(x);
  });
  return o;
}
function byTimeDesc(a,b){return String(b.rec.t||'').localeCompare(String(a.rec.t||''))}
function addStudent(n,c){
  n=String(n).trim().replace(/\s+/g,' ');c=String(c).trim();
  if(!n)return 'Enter the student name.';
  if(c&&S.students.some(function(s){return norm(s.c)===norm(c)}))return 'A student with this QR code already exists.';
  var st={i:uid('u'),n:n,c:c};S.students.push(st);sortStudents();persistRoster();return st;
}
function doImport(text){
  var lines=String(text).split(/\r?\n/).map(function(l){return l.trim()}).filter(Boolean);
  var added=0,skipped=0;
  var codes=new Set(S.students.map(function(s){return norm(s.c)}).filter(Boolean));
  var names=new Set(S.students.map(function(s){return s.n.toLowerCase()}));
  lines.forEach(function(l){
    l=l.replace(/^\d{1,3}[.)]\s+/,'');
    var c='',n=l,m=l.match(/^([^\s,;|\t]*\d[^\s,;|\t]*)\s*[,;|\t]?\s*(.*)$/);
    if(m&&m[1].length>=4){c=m[1];n=m[2]}
    n=n.replace(/\s+/g,' ').trim();
    if(!n||(c&&codes.has(norm(c)))||names.has(n.toLowerCase())){skipped++;return}
    S.students.push({i:uid('u'),n:n,c:c});names.add(n.toLowerCase());if(c)codes.add(norm(c));added++;
  });
  if(added){sortStudents();persistRoster()}
  return {added:added,skipped:skipped};
}

/* ---------- QR decoding ---------- */
async function loadBitmap(file){
  try{if(window.createImageBitmap)return await createImageBitmap(file,{imageOrientation:'from-image'})}catch(e){}
  var url=URL.createObjectURL(file);
  var img=new Image();img.src=url;
  try{await img.decode()}finally{setTimeout(function(){URL.revokeObjectURL(url)},5000)}
  return img;
}
async function decodeQR(file){
  var src=await loadBitmap(file);
  var w0=src.width||src.naturalWidth,h0=src.height||src.naturalHeight;
  if('BarcodeDetector' in window){
    try{var det=new window.BarcodeDetector({formats:['qr_code']});var r=await det.detect(src);if(r&&r[0]&&r[0].rawValue)return r[0].rawValue}catch(e){}
  }
  if(typeof window.jsQR!=='function')throw new Error('jsQR not loaded');
  var cv=document.createElement('canvas'),ctx=cv.getContext('2d',{willReadFrequently:true});
  var seen={};
  var sizes=[1100,700,1600,450];
  for(var k=0;k<sizes.length;k++){
    var sc=Math.min(1,sizes[k]/Math.max(w0,h0));
    var w=Math.max(1,Math.round(w0*sc)),h=Math.max(1,Math.round(h0*sc));
    if(seen[w+'x'+h])continue;seen[w+'x'+h]=1;
    cv.width=w;cv.height=h;ctx.drawImage(src,0,0,w,h);
    var d=ctx.getImageData(0,0,w,h);
    var code=window.jsQR(d.data,w,h,{inversionAttempts:'attemptBoth'});
    if(code&&code.data)return code.data;
    await new Promise(function(res){setTimeout(res,0)});
  }
  return null;
}
async function scanFile(file,mode){
  if(!file)return;
  if(mode==='scan'&&!active()){toast('Create a class first.');return}
  S.busy=true;S.last=null;render();
  var raw=null;
  try{raw=await decodeQR(file)}catch(e){console.warn(e)}
  S.busy=false;
  if(mode==='reg'){
    if(raw){S.f['f-code']=raw;toast('QR read.')}else toast('Could not read the QR. Try again.');
    render();return;
  }
  if(!raw){S.last={kind:'fail'};render();return}
  var st=findStudent(raw);
  if(!st){S.last={kind:'new',raw:raw};S.f['f-newname']='';render();return}
  var r=markIn(st.i,'qr');
  S.last=r&&r.dup?{kind:'dup',i:st.i}:{kind:'ok',i:st.i};
  render();
}

/* ---------- live camera scanner ---------- */
var CAM={on:false,stream:null,raf:0,last:0,busy:false,det:null,cv:null,ctx:null,lastRaw:'',lastAt:0,ac:null};
function beep(){
  try{CAM.ac=CAM.ac||new (window.AudioContext||window.webkitAudioContext)();if(CAM.ac.state==='suspended')CAM.ac.resume();var o=CAM.ac.createOscillator(),g=CAM.ac.createGain();o.frequency.value=880;g.gain.value=.15;o.connect(g);g.connect(CAM.ac.destination);o.start();o.stop(CAM.ac.currentTime+.12)}catch(e){}
  try{if(navigator.vibrate)navigator.vibrate(60)}catch(e){}
}
function camSay(kind,title,sub){var m=$('#cam-msg');m.className='cam-msg '+kind;m.innerHTML='<div class="cam-t">'+esc(title)+'</div><div class="cam-s">'+esc(sub||'')+'</div>'}
function camCount(){var ses=active();if(!ses)return '';var st=statsOf(ses);return (st.p+st.l+st.e)+' of '+st.total+' checked in'}
async function camStart(){
  if(!active()){toast('Create a class first.');return}
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){toast('Live camera is not available here. Use photo scan instead.');return}
  try{CAM.ac=CAM.ac||new (window.AudioContext||window.webkitAudioContext)()}catch(e){}
  var stream;
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false})}
  catch(e){toast(e&&e.name==='NotAllowedError'?'Camera access was blocked. Allow it in your browser settings, then try again.':'Could not open the camera. Use photo scan instead.');return}
  CAM.stream=stream;
  var v=$('#cam-v');v.srcObject=stream;try{await v.play()}catch(e){}
  CAM.on=true;$('#cam').hidden=false;document.body.style.overflow='hidden';
  CAM.det=null;
  if('BarcodeDetector' in window){try{CAM.det=new window.BarcodeDetector({formats:['qr_code']})}catch(e){}}
  CAM.cv=CAM.cv||document.createElement('canvas');CAM.ctx=CAM.cv.getContext('2d',{willReadFrequently:true});
  CAM.lastRaw='';CAM.lastAt=0;CAM.busy=false;
  camSay('idle','Point the camera at the QR on the ID',camCount());
  camLoop();
}
function camStop(){
  CAM.on=false;cancelAnimationFrame(CAM.raf);
  if(CAM.stream){CAM.stream.getTracks().forEach(function(t){t.stop()});CAM.stream=null}
  var v=$('#cam-v');if(v)v.srcObject=null;
  $('#cam').hidden=true;document.body.style.overflow='';
}
function camLoop(){
  if(!CAM.on)return;
  CAM.raf=requestAnimationFrame(camLoop);
  var now=performance.now(),v=$('#cam-v');
  if(CAM.busy||now-CAM.last<140||v.readyState<2||!v.videoWidth)return;
  CAM.last=now;CAM.busy=true;
  camRead(v).then(function(raw){CAM.busy=false;if(raw&&CAM.on)camGot(raw)}).catch(function(){CAM.busy=false});
}
async function camRead(v){
  if(CAM.det){
    var threw=false;
    try{var r=await CAM.det.detect(v);if(r&&r[0]&&r[0].rawValue)return r[0].rawValue}catch(e){threw=true}
    if(!threw)return null;
  }
  if(typeof window.jsQR!=='function')return null;
  var sc=Math.min(1,800/v.videoWidth),w=Math.max(1,Math.round(v.videoWidth*sc)),h=Math.max(1,Math.round(v.videoHeight*sc));
  CAM.cv.width=w;CAM.cv.height=h;CAM.ctx.drawImage(v,0,0,w,h);
  var d=CAM.ctx.getImageData(0,0,w,h),code=window.jsQR(d.data,w,h,{inversionAttempts:'dontInvert'});
  return code&&code.data?code.data:null;
}
function camGot(raw){
  var now=Date.now();
  if(raw===CAM.lastRaw&&now-CAM.lastAt<3500)return;
  CAM.lastRaw=raw;CAM.lastAt=now;
  var st=findStudent(raw);
  if(!st){
    camStop();beep();S.tab='scan';S.last={kind:'new',raw:raw};S.f['f-newname']='';render();window.scrollTo(0,0);
    toast('New QR. Register this student.');return;
  }
  var r=markIn(st.i,'qr');if(!r)return;
  beep();
  if(r.dup)camSay('dup',st.n,'Already timed in at '+fmtTime(r.rec.t));
  else camSay(r.rec.s==='late'?'late':'ok',st.n,(r.rec.s==='late'?'Late · ':'Timed in · ')+fmtTime(r.rec.t)+' · '+camCount());
  S.last={kind:r.dup?'dup':'ok',i:st.i};render();
}
document.addEventListener('visibilitychange',function(){if(document.hidden&&CAM.on)camStop()});

/* ---------- exports ---------- */
function csvEsc(v){v=String(v==null?'':v);return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function toCSV(rows){return '﻿'+rows.map(function(r){return r.map(csvEsc).join(',')}).join('\r\n')}
function slug(s){return String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')||'class'}
function sessionCSV(ses){
  var rows=[['Date','Subject','Student','ID/QR','Status','Time in','Method']];
  S.students.forEach(function(st){
    var r=recOf(ses,st.i);
    rows.push([ses.date,ses.subject,st.n,st.c,r?(r.s==='present'?'Present':r.s==='late'?'Late':'Excused'):'Absent',r&&r.t&&r.s!=='excused'?fmtTime(r.t):'',r?(r.m==='qr'?'QR':'Manual'):'']);
  });
  return toCSV(rows);
}
function matrixCSV(){
  var sess=sortedSessions('asc');
  var head=['Student','ID/QR'].concat(sess.map(function(s){return s.date+' '+s.subject}),['Present','Late','Excused','Absent','Rate %']);
  var rows=[head];
  report().forEach(function(x){
    var cells=sess.map(function(ses){var r=recOf(ses,x.st.i);return !r?'A':r.s==='late'?'L':r.s==='excused'?'E':'P'});
    rows.push([x.st.n,x.st.c].concat(cells,[x.p,x.l,x.e,x.a,x.rate==null?'':x.rate]));
  });
  return toCSV(rows);
}
function saveFile(filename,data){
  try{
    var b=new Blob([data],{type:'text/csv;charset=utf-8'}),u=URL.createObjectURL(b),a=document.createElement('a');
    a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(u)},5000);toast('Saving '+filename);
  }catch(e){S.sheet={type:'text',title:filename,text:data.replace(/^\ufeff/,'')};renderSheet()}
}
function summaryText(ses){
  var c=classify(ses),total=S.students.length;
  var L=[];
  L.push('Attendance'+(S.section?' - '+S.section:''));
  L.push(ses.subject+' | '+fmtDate(ses.date));
  L.push('Present: '+c.p.length+' | Late: '+c.l.length+' | Excused: '+c.e.length+' | Absent: '+c.a.length+' | Total: '+total);
  if(c.l.length)L.push('','Late: '+c.l.map(function(x){return x.st.n+' ('+fmtTime(x.rec.t)+')'}).join('; '));
  if(c.e.length)L.push('','Excused: '+c.e.map(function(x){return x.st.n}).join('; '));
  if(c.a.length)L.push('','Absent: '+c.a.map(function(x){return x.st.n}).join('; '));

async function copyText(t){

function report(){
  var sess=sortedSessions('asc');
  return S.students.map(function(st){
    var p=0,l=0,e=0,a=0;
    sess.forEach(function(ses){var r=recOf(ses,st.i);if(!r)a++;else if(r.s==='late')l++;else if(r.s==='excused')e++;else p++});
    var den=sess.length-e;
    return {st:st,p:p,l:l,e:e,a:a,rate:den>0?Math.round(100*(p+l)/den):null};
  }).sort(function(x,y){return y.a-x.a||x.st.n.localeCompare(y.st.n)});
}

function render(){
  var ae=document.activeElement,keep=null;
  if(ae&&ae.id&&ae.matches&&ae.matches('input,textarea,select'))keep={id:ae.id,s:ae.selectionStart,e:ae.selectionEnd};
  $('#app').innerHTML=headerHTML()+'<main class="in">'+(S.loading?'<section class="card"><p class="muted">Loading data...</p></section>':viewHTML())+'</main>'+tabsHTML();
  if(keep){var el=document.getElementById(keep.id);if(el){el.focus();try{el.setSelectionRange(keep.s,keep.e)}catch(e){}}}
}
function partial(id,fn){var el=document.getElementById(id);if(el)el.innerHTML=fn()}

/* ---------- sheet ---------- */
function renderSheet(){
  var el=$('#sheet'),sh=S.sheet;
  if(!sh){el.innerHTML='';return}
  var body='';
  if(sh.type==='class'){
    var last=sortedSessions('desc')[0];
    body='<form class="fields" data-form="newclass"><h2 class="h2">New class</h2>'
      +'<div><label for="f-subj">Subject</label><input type="text" id="f-subj" value="'+esc(fv('f-subj',last?last.subject:''))+'" placeholder="e.g. Math 101" autocomplete="off"></div>'
      +'<div><label for="f-date">Date</label><input type="date" id="f-date" value="'+esc(fv('f-date',todayStr()))+'"></div>'
      +'<div class="grid2"><div><label for="f-start">Start time</label><input type="time" id="f-start" value="'+esc(fv('f-start',last?last.start:'07:30'))+'"></div><div><label for="f-grace">Grace period (minutes)</label><input type="number" id="f-grace" min="0" max="120" inputmode="numeric" value="'+esc(fv('f-grace',last?last.grace:10))+'"></div></div>'
      +'<p class="hint">Time-ins after the start time plus the grace period count as late.</p>'
      +(S.err?'<p class="err">'+esc(S.err)+'</p>':'')
      +'<div class="acts"><button class="btn pri" type="submit">Create</button><button class="btn" type="button" data-act="closesheet">Cancel</button></div></form>';
  }else if(sh.type==='sched'){body=schedForm();}else if(sh.type==='text'){
    body='<div class="fields"><h2 class="h2">'+esc(sh.title)+'</h2><p class="hint">Could not save directly. Copy the text below.</p><textarea id="f-copy" readonly style="min-height:200px">'+esc(sh.text)+'</textarea><div class="acts"><button class="btn pri" data-act="copyarea">Copy</button><button class="btn" data-act="closesheet">Close</button></div></div>';
  }
  el.innerHTML='<div class="sheet" role="dialog" aria-modal="true"><div class="sheet-bg" data-act="closesheet"></div><div class="sheet-p">'+body+'</div></div>';
  if(sh.type==='text')setTimeout(function(){var ta=$('#f-copy');if(ta){ta.focus();ta.select()}},0);
}

/* ---------- actions ---------- */
function act(a,d){
  switch(a){
    case 'tab':S.tab=d.t;S.expanded=null;S.confirm=null;S.err='';window.scrollTo(0,0);render();break;
    case 'scan':camStart();break;
    case 'photo':$('#f-cam').click();break;
    case 'camstop':camStop();render();break;
    case 'gallery':$('#f-gal').click();break;
    case 'scanreg':$('#f-reg').click();break;
    case 'newclass':S.sheet={type:'class'};S.err='';renderSheet();break;
    case 'closesheet':S.sheet=null;S.err='';renderSheet();break;
    case 'dismiss':S.last=null;render();break;
    case 'copyarea':{var ta=$('#f-copy');if(ta){ta.focus();ta.select();try{document.execCommand('copy');toast('Copied.')}catch(e){}}break}
    case 'timein':{
      var st=stuBy(d.i),r=markIn(d.i,'manual');
      if(r&&st){if(r.dup)toast(st.n+' is already timed in.');else{toast('Time in: '+st.n);if(S.tab==='scan'){S.last={kind:'ok',i:d.i};S.f['f-q']=''}}}
      S.expanded=null;render();break;
    }
    case 'setstatus':setStatus(d.i,d.s);S.expanded=null;render();break;
    case 'removerec':removeRec(d.i);if(S.last&&S.last.i===d.i)S.last=null;S.expanded=null;render();break;
    case 'expand':S.expanded=S.expanded===d.i?null:d.i;S.confirm=null;delete S.f['f-rn'];render();break;
    case 'filter':S.filter=d.f;S.expanded=null;render();break;
    case 'opensession':setActive(d.id);S.tab='list';S.last=null;S.expanded=null;window.scrollTo(0,0);render();break;
    case 'delsession':
      if(arm('del:'+d.id)){
        delete S.sessions[d.id];removeSessionStore(d.id);
        if(S.activeId===d.id){S.activeId=null;pickActive();ls.set('talaan-active',S.activeId||'')}
        toast('Class deleted.');render();
      }break;
    case 'csv':{var ses=S.sessions[d.id];if(ses)saveFile('talaan-'+ses.date+'-'+slug(ses.subject)+'.csv',sessionCSV(ses));break}
    case 'csvall':saveFile('talaan-buong-ulat-'+todayStr()+'.csv',matrixCSV());break;
    case 'copysum':{var s2=S.sessions[d.id];if(s2)copyText(summaryText(s2));break}
    case 'regnew':{
      var nm=String(S.f['f-newname']||'').trim(),raw=S.last&&S.last.raw;
      if(!nm){toast('Enter a name first.');break}
      var res=addStudent(nm,raw||'');
      if(typeof res==='string'){toast(res);break}
      markIn(res.i,'qr');S.last={kind:'ok',i:res.i};S.f['f-newname']='';render();break;
    }
    case 'link':{
      var raw2=S.last&&S.last.raw,t=stuBy(d.i);
      if(!t||!raw2)break;
      if(S.students.some(function(s){return s.c&&norm(s.c)===norm(raw2)})){toast('This QR is already in use.');break}
      S.students=S.students.map(function(s){return s.i===t.i?{i:s.i,n:s.n,c:raw2}:s});persistRoster();
      markIn(t.i,'qr');S.last={kind:'ok',i:t.i};render();break;
    }
    case 'delstudent':
      if(arm('ds:'+d.i)){
        S.students=S.students.filter(function(s){return s.i!==d.i});persistRoster();S.expanded=null;toast('Removed from list.');render();
      }break;
    case 'renamesave':{
      var v=String(S.f['f-rn']||'').trim().replace(/\s+/g,' ');
      if(!v){toast('Enter a name.');break}
      S.students=S.students.map(function(s){return s.i===d.i?{i:s.i,n:v,c:s.c}:s});sortStudents();persistRoster();S.expanded=null;delete S.f['f-rn'];toast('Saved.');render();break;
    }
    case 'newsched':S.sheet={type:'sched'};S.err='';renderSheet();break;
    case 'delsched':
      if(arm('dsc:'+d.id)){S.schedules=S.schedules.filter(function(x){return x.id!==d.id});persistRoster();toast('Schedule deleted.');render()}
      break;
    case 'startsched':{
      var sc=S.schedules.find(function(x){return x.id===d.id});if(!sc)break;
      var tdy=todayStr(),exs=sortedSessions('desc').find(function(s){return s.sch===sc.id&&s.date===tdy}),sid;
      if(exs){sid=exs.id}else{
        sid=uid('s');
        S.sessions[sid]={id:sid,date:tdy,subject:sc.subject,start:sc.start,grace:sc.grace,created:Date.now(),sch:sc.id,records:[]};
        persistSession(sid);
      }
      setActive(sid);S.last=null;render();toast('Class started: '+sc.subject);break;
    }
    case 'switchsess':setActive(d.id);S.last=null;render();toast('Switched class.');break;
    case 'importtoggle':S.importOpen=!S.importOpen;render();break;
  }
}
function submitForm(name){
  if(name==='newclass'){
    var subj=$('#f-subj').value.trim(),date=$('#f-date').value,start=$('#f-start').value,grace=parseInt($('#f-grace').value,10);
    if(!subj){S.err='Enter the subject.';renderSheet();return}
    if(!date||!start){S.err='Fill in the date and time.';renderSheet();return}
    var id=uid('s');
    S.sessions[id]={id:id,date:date,subject:subj,start:start,grace:isNaN(grace)?10:Math.max(0,Math.min(120,grace)),created:Date.now(),records:[]};
    persistSession(id);setActive(id);S.sheet=null;S.err='';S.tab='scan';S.last=null;
    ['f-subj','f-date','f-start','f-grace'].forEach(function(k){delete S.f[k]});
    renderSheet();window.scrollTo(0,0);render();toast('Class created.');
  }else if(name==='newsched'){
    var sj=$('#f-ssubj').value.trim(),ss=$('#f-sstart').value,sg=parseInt($('#f-sgrace').value,10);
    var days=[0,1,2,3,4,5,6].filter(function(k){return $('#f-day-'+k).checked});
    if(!sj){S.err='Enter the subject.';renderSheet();return}
    if(!days.length){S.err='Pick at least one day.';renderSheet();return}
    if(!ss){S.err='Enter the start time.';renderSheet();return}
    S.schedules=S.schedules.concat([{id:uid('sc'),subject:sj,days:days,start:ss,grace:isNaN(sg)?10:Math.max(0,Math.min(120,sg))}]);
    persistRoster();S.sheet=null;S.err='';
    ['f-ssubj','f-sstart','f-sgrace'].concat([0,1,2,3,4,5,6].map(function(k){return 'f-day-'+k})).forEach(function(k){delete S.f[k]});
    renderSheet();render();toast('Schedule added.');
  }else if(name==='section'){
    S.section=String($('#f-section').value||'').trim();persistRoster();delete S.f['f-section'];toast('Section saved.');render();
  }else if(name==='addstudent'){
    var res=addStudent($('#f-name').value,$('#f-code').value);
    if(typeof res==='string'){S.err=res;render();return}
    S.err='';S.f['f-name']='';S.f['f-code']='';toast('Added '+res.n+'.');render();
  }else if(name==='import'){
    var r=doImport($('#f-import').value);
    S.f['f-import']='';S.importOpen=false;toast('Added: '+r.added+(r.skipped?' | skipped: '+r.skipped:''));render();
  }
}

/* ---------- wiring ---------- */
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  act(b.dataset.act,b.dataset);
});
document.addEventListener('input',function(e){
  var t=e.target;if(!t.id||!t.matches('input,textarea,select'))return;
  S.f[t.id]=t.type==='checkbox'?t.checked:t.value;
  if(t.id==='f-q')partial('manual-results',manualResults);
  else if(t.id==='f-newname')partial('link-results',linkResults);
  else if(t.id==='f-sq')partial('roster-results',rosterResults);
});
document.addEventListener('submit',function(e){e.preventDefault();var n=e.target.dataset&&e.target.dataset.form;if(n)submitForm(n)});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&S.sheet){S.sheet=null;renderSheet()}});
function bindFile(id,mode){
  var el=document.getElementById(id);
  el.addEventListener('change',function(){var f=el.files&&el.files[0];el.value='';scanFile(f,mode)});
}
bindFile('f-cam','scan');bindFile('f-gal','scan');bindFile('f-reg','reg');

init();
})();
</script>
</body>
</html>
